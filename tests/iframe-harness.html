<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M1 回归测试 · iframe 宿主页</title>
<style>
    html, body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #fff; }
    #log { padding: 10px 16px; font: 13px/1.5 Consolas, monospace; background: #0F172A; color: #E2E8F0; }
    iframe { display: block; width: 100%; height: 720px; border: 0; }
</style>
</head>
<body>
<div id="log">等待来自 iframe 的 postMessage…</div>
<iframe id="lesson" src="/public/lessons/sorting.html?stage=code" allow="fullscreen" title="M1 回归测试用嵌入"></iframe>
<script>
    // 仅用于回归测试：记录课件发来的 lesson-fullscreen 消息
    window.__msgs = [];
    window.addEventListener('message', function (event) {
        if (!event.data || event.data.type !== 'lesson-fullscreen') return;
        window.__msgs.push(event.data.action);
        document.getElementById('log').textContent =
            '收到 ' + window.__msgs.length + ' 条消息：' + JSON.stringify(window.__msgs);
    });
</script>
</body>
</html>
