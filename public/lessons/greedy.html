<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>贪心算法全景演练</title>
<style>
:root{--blue:#0ea5e9;--deep:#0284c7;--amber:#f59e0b;--red:#ef4444;--green:#10b981;--purple:#8b5cf6;--ink:#0f172a;--muted:#64748b;--glass:rgba(255,255,255,.9)}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(135deg,#e0c3fc,#8ec5fc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}.wrapper{height:100%;padding:16px 24px 20px}.app{height:100%;max-width:1600px;margin:auto;display:flex;flex-direction:column;gap:16px}.glass{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.68);border-radius:16px;box-shadow:0 8px 24px rgba(31,38,135,.09)}header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;border-radius:16px;color:#fff;background:linear-gradient(135deg,rgba(2,132,199,.96),rgba(14,165,233,.96));box-shadow:0 8px 22px rgba(2,132,199,.2)}h1{margin:0;font-size:22px}.subtitle{display:inline-block;margin-left:9px;padding:4px 9px;border-radius:999px;background:rgba(15,23,42,.16);font-size:12px;font-weight:500}.head-actions{display:flex;align-items:center;gap:12px}.mode-select,.full-btn{border:2px solid rgba(255,255,255,.65);border-radius:8px;background:transparent;color:#fff;padding:8px 14px;font-size:14px;font-weight:800;cursor:pointer}.mode-select option{color:#0f172a}.content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(370px,38%) 1fr;gap:16px}.code-window{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:#1e1e1e;box-shadow:0 8px 24px rgba(0,0,0,.17)}.code-head{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#2d2d2d;color:#9ca3af;font-size:13px}.dot{width:12px;height:12px;border-radius:50%}.r{background:#ef4444}.y{background:#f59e0b}.g{background:#10b981}.code-name{margin-left:8px}.complexity{margin-left:auto;color:#fbbf24;font-weight:700}.code{flex:1;overflow:auto;padding:12px 0;color:#d4d4d4;font:14px/1.72 Consolas,monospace;counter-reset:line}.code-line{position:relative;min-height:28px;white-space:pre;padding:2px 16px 2px 58px;border-left:4px solid transparent}.code-line:before{counter-increment:line;content:counter(line);position:absolute;left:7px;width:34px;padding-right:8px;text-align:right;color:#64748b;border-right:1px solid #475569}.code-line.active{color:#fff;background:rgba(245,158,11,.18);border-left-color:var(--amber)}.kw{color:#c586c0}.num{color:#b5cea8}.comment{color:#6a9955}.fn{color:#dcdcaa}.str{color:#ce9178}.right{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}.visual-card{flex:.65;min-height:0;padding:14px 18px;display:flex;flex-direction:column}.visual-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px;border-bottom:1px dashed #cbd5e1}.visual-head b{color:#0369a1}.step-badge{padding:5px 10px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:800}.stage{flex:1;min-height:0;overflow:auto;padding:10px}.controls{flex:none;display:flex;justify-content:center;gap:12px;padding-top:10px;border-top:1px dashed #cbd5e1}.btn{min-width:112px;border:2px solid #94a3b8;border-radius:999px;background:#fff;color:#64748b;padding:9px 16px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--blue);color:#0284c7}.btn:disabled{opacity:.38;cursor:not-allowed}.lower{flex:.35;min-height:0;display:grid;grid-template-columns:minmax(230px,.78fr) 1.52fr;gap:14px}.trace,.tips{min-height:0;overflow:auto;padding:16px 19px}.trace{border:2px solid var(--blue)}.trace h3,.tips h3{margin:0 0 9px;color:#0284c7;font-size:15px}.trace p,.tips-content{margin:0;color:#334155;font-size:14px;line-height:1.72}.trace code,.tips code{padding:2px 5px;border-radius:4px;background:#e0f2fe;color:#0284c7;font-weight:800}.tips h3{color:#0f172a;border-bottom:1px dashed #cbd5e1;padding-bottom:8px}
.phase-strip{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.phase{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#94a3b8;font-size:11px;font-weight:800}.phase.on{background:#fef3c7;color:#b45309}.phase.done{background:#d1fae5;color:#047857}.interval-scene{width:min(820px,100%);margin:auto}.legend{display:flex;justify-content:center;gap:16px;margin-bottom:6px;color:#64748b;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:3px}.timeline{position:relative;padding:2px 0 23px 34px}.axis{position:absolute;left:34px;right:0;bottom:5px;height:2px;background:#94a3b8}.tick{position:absolute;bottom:-18px;transform:translateX(-50%);font:10px Consolas;color:#64748b}.last-line{position:absolute;top:0;bottom:5px;width:2px;background:var(--purple);z-index:3;box-shadow:0 0 0 2px rgba(139,92,246,.1)}.last-line:before{content:'lastEnd';position:absolute;top:-2px;left:5px;color:#6d28d9;font:800 10px Consolas}.interval-row{position:relative;height:27px}.interval-id{position:absolute;left:-30px;top:4px;width:22px;color:#64748b;font:800 12px Consolas;text-align:center}.interval{position:absolute;top:2px;height:22px;border:2px solid #7dd3fc;border-radius:6px;background:#e0f2fe;color:#0369a1;font:800 11px/18px Consolas;text-align:center;transition:.25s;overflow:hidden}.interval.current{z-index:4;transform:translateY(-2px) scale(1.04);border-color:var(--amber);background:#fef3c7;color:#b45309;box-shadow:0 5px 12px rgba(245,158,11,.22)}.interval.selected{border-color:#34d399;background:#d1fae5;color:#047857}.interval.rejected{border-color:#fda4af;background:#ffe4e6;color:#be123c;opacity:.48}.summary{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:7px;flex-wrap:wrap}.pill{padding:7px 12px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:800}.pill strong{color:#059669}.construct-scene{width:min(780px,100%);margin:auto;padding-top:4px}.metric-row{display:flex;justify-content:center;gap:12px;margin-bottom:13px}.metric{padding:7px 13px;border-radius:9px;background:#f8fafc;color:#475569;font-size:13px;font-weight:800}.metric em{font-style:normal;color:#dc2626;font-size:17px}.digit-row{display:flex;align-items:center;justify-content:center;gap:9px;min-height:64px;margin:5px 0 14px}.row-label{width:72px;color:#475569;font-size:13px;font-weight:800;text-align:right}.digit{position:relative;width:48px;height:48px;display:grid;place-items:center;border:2px solid #bae6fd;border-radius:10px;background:#fff;color:#0369a1;font:900 21px Consolas;transition:.25s}.digit:after{content:attr(data-index);position:absolute;top:51px;color:#94a3b8;font:10px Consolas}.digit.past{background:#f1f5f9;color:#94a3b8;border-color:#cbd5e1}.digit.current{transform:translateY(-6px);border-color:var(--amber);background:#fef3c7;color:#b45309;box-shadow:0 7px 14px rgba(245,158,11,.2)}.stack-area{min-height:85px;margin:8px auto 0;padding:12px 16px;width:min(590px,100%);border:2px dashed #94a3b8;border-radius:13px;background:#f8fafc}.stack-label{text-align:center;color:#64748b;font-size:12px;font-weight:800}.stack{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:48px;margin-top:7px}.stack .digit{border-color:#34d399;background:#d1fae5;color:#047857}.stack .digit.top{box-shadow:0 0 0 3px rgba(139,92,246,.2);border-color:var(--purple)}.popped{margin-left:4px;color:#dc2626;font-size:12px;font-weight:800;animation:fade .7s ease}@keyframes fade{from{transform:translateY(0);opacity:1}to{transform:translateY(-12px);opacity:.5}}.answer{margin:10px auto 0;width:max-content;max-width:100%;padding:8px 16px;border-radius:10px;background:#ecfdf5;color:#047857;font:900 18px Consolas}.empty{color:#94a3b8;font-size:13px}
#board{position:fixed;inset:0;z-index:40;display:none;touch-action:none}.board-tools{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;gap:8px}.board-btn{border:0;border-radius:999px;background:#fff;padding:11px 16px;color:#334155;font-weight:800;box-shadow:0 6px 20px rgba(15,23,42,.18);cursor:pointer}.board-btn.active{background:#ef4444;color:#fff}.clear-btn{display:none}.board-on .clear-btn{display:block}@media(max-width:900px){body{height:auto;min-height:100vh;overflow:auto}.wrapper{height:auto;padding:10px}.app{min-height:100vh}.content{grid-template-columns:1fr}.code-window{height:420px}.right{min-height:740px}.lower{grid-template-columns:1fr}.trace,.tips{max-height:270px}.subtitle{display:none}}@media(max-width:600px){header{padding:10px 12px}h1{font-size:17px}.full-btn{display:none}.mode-select{max-width:190px}.wrapper{padding:5px}.interval-row{height:25px}.digit{width:39px;height:43px}.digit-row{gap:5px}.row-label{width:45px}.btn{min-width:88px;padding:8px}.legend{gap:8px}}
</style></head>
<body><canvas id="board"></canvas><div class="wrapper"><div class="app"><header><h1>✨ 白学在线 - 贪心算法全景演练 <span class="subtitle">局部选择、交换论证与不可反悔</span></h1><div class="head-actions"><select id="mode" class="mode-select"><option value="interval">区间选择</option><option value="construct">构造贪心：删数取最小</option></select><button id="fullscreen" class="full-btn">🖥️ 全屏演示</button></div></header><div class="content"><section class="code-window"><div class="code-head"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span id="codeName" class="code-name"></span><span id="complexity" class="complexity"></span></div><div id="code" class="code"></div></section><div class="right"><section class="visual-card glass"><div class="visual-head"><b id="visualTitle"></b><span id="stepBadge" class="step-badge"></span></div><div id="stage" class="stage"></div><div class="controls"><button id="prev" class="btn">← 上一步</button><button id="reset" class="btn">重置状态</button><button id="next" class="btn primary">下一步 →</button></div></section><div class="lower"><section class="trace glass"><h3>实时执行分析</h3><p id="description"></p></section><section class="tips glass"><h3>💡 算法答题思路与核心提炼</h3><div id="tips" class="tips-content"></div></section></div></div></div></div></div><div class="board-tools"><button id="clearBoard" class="board-btn clear-btn">清空</button><button id="toggleBoard" class="board-btn">🖌️ 开启白板</button></div>
<script>
const MODES={
interval:{file:'interval_scheduling.cpp',complexity:'排序 O(n log n)，扫描 O(n)',visual:'按结束时间选择最多个互不重叠区间',phases:['排序','取出区间','判断相交','选择','舍弃','完成'],tips:'<b>贪心策略：</b>每次选择右端点最小且与已选区间不重叠的区间。越早结束，就为后续区间留下越大的可用范围。<br><b>交换论证：</b>设某个最优解首先选择的区间为 X。贪心区间 G 的结束时间不晚于 X，用 G 替换 X 不会影响后续选择，所以至少存在一个最优解以 G 开头。<br><b>边界约定：</b>本例允许前一区间在时刻 r 结束、后一区间在同一时刻 l=r 开始，因此判断条件是 <code>l &gt;= lastEnd</code>。',code:['struct Segment { int l, r; char id; };','sort(seg.begin(), seg.end(), byRightEnd);','int lastEnd = -INF, answer = 0;','for (auto [l, r, id] : seg) {','    if (l >= lastEnd) {','        choose(id);','        lastEnd = r;','        answer++;','    }','}','cout << answer;']},
construct:{file:'remove_k_digits.cpp',complexity:'时间 O(n)，空间 O(n)',visual:'删除 K 位数字，构造最小结果',phases:['读入数字','比较栈顶','删除大数','压入数字','清理尾部','完成'],tips:'<b>贪心策略：</b>高位对数值影响更大。读到更小数字时，只要还可以删除，就立即弹出它左侧更大的数字，让小数字尽量前移。<br><b>单调栈：</b>栈内保留的是当前还可能出现在答案中的数字；每个数字最多入栈、出栈各一次，所以总复杂度是 O(n)。<br><b>易错点：</b>扫描结束后若 <code>k &gt; 0</code>，还要从末尾删除；最终答案需去掉前导零，若全部删空则返回 0。',code:['string removeKdigits(string num, int k) {','    string st;','    for (char digit : num) {','        while (k > 0 && !st.empty()','               && st.back() > digit) {','            st.pop_back();','            k--;','        }','        st.push_back(digit);','    }','    while (k > 0) st.pop_back(), k--;','    trimLeadingZeros(st);','    return st.empty() ? "0" : st;','}']}}
const intervals=[{id:'A',l:1,r:4},{id:'B',l:3,r:5},{id:'C',l:0,r:6},{id:'D',l:5,r:7},{id:'E',l:3,r:9},{id:'F',l:5,r:9},{id:'G',l:6,r:10},{id:'H',l:8,r:11},{id:'I',l:8,r:12},{id:'J',l:2,r:14},{id:'K',l:12,r:16}],digits=[...'1432219'];let currentMode='interval',states=[],stateIndex=0;const $=id=>document.getElementById(id);const copy=x=>JSON.parse(JSON.stringify(x));function S(line,phase,desc,data={}){return{line,phase,desc,...copy(data)}}
function buildInterval(){const sorted=[...intervals].sort((a,b)=>a.r-b.r||a.l-b.l),status={},chosen=[],out=[];let lastEnd=-1;out.push(S(2,'排序','先按右端点从小到大排序；右端点相同的先后顺序不影响本题答案。',{order:sorted.map(x=>x.id),status,lastEnd,chosen}));for(const x of sorted){out.push(S(4,'取出区间',`取出区间 <code>${x.id}=[${x.l},${x.r}]</code>，准备与当前结束位置比较。`,{order:sorted.map(y=>y.id),status,lastEnd,chosen,current:x.id}));const ok=x.l>=lastEnd;out.push(S(5,'判断相交',`比较 <code>l=${x.l}</code> 与 <code>lastEnd=${lastEnd}</code>：条件 ${x.l} ≥ ${lastEnd} 为 <b>${ok?'真':'假'}</b>。`,{order:sorted.map(y=>y.id),status,lastEnd,chosen,current:x.id,checking:true}));if(ok){status[x.id]='selected';chosen.push(x.id);lastEnd=x.r;out.push(S(8,'选择',`选择 ${x.id}，把 <code>lastEnd</code> 更新为 ${x.r}，当前答案数量为 ${chosen.length}。`,{order:sorted.map(y=>y.id),status,lastEnd,chosen,current:x.id}))}else{status[x.id]='rejected';out.push(S(5,'舍弃',`${x.id} 的起点 ${x.l} 早于 ${lastEnd}，会与已选区间重叠，因此舍弃。`,{order:sorted.map(y=>y.id),status,lastEnd,chosen,current:x.id}))}}out.push(S(11,'完成',`扫描结束，最多可选择 ${chosen.length} 个区间：<code>${chosen.join('、')}</code>。`,{order:sorted.map(y=>y.id),status,lastEnd,chosen,done:true}));return out}
function buildConstruct(){let st=[],k=3,out=[];out.push(S(2,'读入数字','目标：从 <code>1432219</code> 中删除 3 位，使剩余数字组成的数最小。',{st,k,pos:-1}));digits.forEach((digit,pos)=>{out.push(S(3,'读入数字',`读到第 ${pos+1} 位数字 <code>${digit}</code>。`,{st,k,pos,current:digit}));while(k>0&&st.length&&st.at(-1)>digit){const top=st.at(-1);out.push(S(5,'比较栈顶',`栈顶 ${top} &gt; 当前数字 ${digit}，删除高位的 ${top} 能让结果变小。`,{st,k,pos,current:digit,compare:true}));st.pop();k--;out.push(S(7,'删除大数',`弹出 ${top}，剩余删除次数 <code>k=${k}</code>。`,{st,k,pos,current:digit,popped:top}))}st.push(digit);out.push(S(9,'压入数字',`将 ${digit} 压入栈，当前保留序列为 <code>${st.join('')}</code>。`,{st,k,pos,current:digit}))});out.push(S(11,'清理尾部',k?`扫描结束仍需删除 ${k} 位，应从尾部继续删除。`:'扫描结束时 k 已经为 0，不需要再删除尾部。',{st,k,pos:digits.length}));while(k>0){st.pop();k--}const answer=st.join('').replace(/^0+/,'')||'0';out.push(S(13,'完成',`最终保留序列为 <code>${answer}</code>。`,{st,k,pos:digits.length,answer,done:true}));return out}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function color(s){let [main,comment]=s.split('//'),h=esc(main).replace(/&quot;([^&]*)&quot;/g,'<span class="str">&quot;$1&quot;</span>').replace(/\b(struct|int|char|auto|for|if|while|string|return)\b/g,'<span class="kw">$1</span>').replace(/\b(\d+)\b/g,'<span class="num">$1</span>').replace(/\b(sort|choose|removeKdigits|trimLeadingZeros|empty|pop_back|push_back)\b/g,'<span class="fn">$1</span>');if(comment!==undefined)h+='<span class="comment">//'+esc(comment)+'</span>';return h}
function renderCode(){const box=$('code'),active=states[stateIndex].line;box.innerHTML=MODES[currentMode].code.map((x,i)=>`<div id="line-${i+1}" class="code-line ${active===i+1?'active':''}">${color(x)}</div>`).join('');$('line-'+active)?.scrollIntoView({block:'center'})}function phases(active){const ps=MODES[currentMode].phases,i=Math.max(0,ps.indexOf(active));return `<div class="phase-strip">${ps.map((p,k)=>`<span class="phase ${k===i?'on':k<i?'done':''}">${p}</span>`).join('')}</div>`}
function renderInterval(s){const order=s.order.map(id=>intervals.find(x=>x.id===id));const ticks=Array.from({length:9},(_,i)=>i*2),ratio=Math.max(0,s.lastEnd)/16,lineOffset=34*(1-ratio);return `<div class="interval-scene">${phases(s.phase)}<div class="legend"><span><i style="background:#fef3c7"></i>当前</span><span><i style="background:#d1fae5"></i>已选择</span><span><i style="background:#ffe4e6"></i>已舍弃</span></div><div class="timeline">${s.lastEnd>=0?`<div class="last-line" style="left:calc(${ratio*100}% + ${lineOffset}px)"></div>`:''}${order.map(x=>`<div class="interval-row"><span class="interval-id">${x.id}</span><div class="interval ${s.current===x.id?'current ':''}${s.status[x.id]||''}" style="left:${x.l/16*100}%;width:${(x.r-x.l)/16*100}%">[${x.l},${x.r}]</div></div>`).join('')}<div class="axis">${ticks.map(t=>`<span class="tick" style="left:${t/16*100}%">${t}</span>`).join('')}</div></div><div class="summary"><span class="pill">当前结束位置：${s.lastEnd<0?'−∞':s.lastEnd}</span><span class="pill">已选：<strong>${s.chosen.length?s.chosen.join('、'):'空集'}</strong></span><span class="pill">数量：<strong>${s.chosen.length}</strong></span></div></div>`}
function renderConstruct(s){return `<div class="construct-scene">${phases(s.phase)}<div class="metric-row"><span class="metric">原数：1432219</span><span class="metric">还可删除：<em>${s.k}</em> 位</span></div><div class="digit-row"><span class="row-label">输入</span>${digits.map((d,i)=>`<span data-index="第${i+1}位" class="digit ${i<s.pos?'past ':''}${i===s.pos?'current':''}">${d}</span>`).join('')}</div><div class="stack-area"><div class="stack-label">保留栈（右侧是栈顶）</div><div class="stack">${s.st.length?s.st.map((d,i)=>`<span class="digit ${i===s.st.length-1?'top':''}">${d}</span>`).join(''):'<span class="empty">暂时为空</span>'}${s.popped?`<span class="popped">← 删除 ${s.popped}</span>`:''}</div></div>${s.answer?`<div class="answer">最小结果 = ${s.answer}</div>`:''}</div>`}
function selfCheck(){const a=buildInterval().at(-1),b=buildConstruct().at(-1);if(a.chosen.join(',')!=='A,D,H,K'||a.chosen.length!==4)throw new Error('区间选择状态计算错误');if(b.answer!=='1219')throw new Error('删数贪心状态计算错误')}
function render(){const c=MODES[currentMode],s=states[stateIndex];$('codeName').textContent=c.file;$('complexity').textContent=c.complexity;$('visualTitle').textContent=c.visual;$('stepBadge').textContent=`第 ${stateIndex+1} / ${states.length} 步`;$('description').innerHTML=`<b>【${s.phase}】</b><br>${s.desc}`;$('tips').innerHTML=c.tips;$('stage').innerHTML=currentMode==='interval'?renderInterval(s):renderConstruct(s);$('prev').disabled=stateIndex===0;$('next').disabled=stateIndex===states.length-1;renderCode()}function load(mode){currentMode=MODES[mode]?mode:'interval';$('mode').value=currentMode;states=currentMode==='interval'?buildInterval():buildConstruct();stateIndex=0;history.replaceState(null,'','?mode='+currentMode);render()}$('prev').onclick=()=>{if(stateIndex){stateIndex--;render()}};$('next').onclick=()=>{if(stateIndex<states.length-1){stateIndex++;render()}};$('reset').onclick=()=>{stateIndex=0;render()};$('mode').onchange=e=>load(e.target.value);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});function tellParent(action){if(parent!==window)parent.postMessage({type:'lesson-fullscreen',action},location.origin)}$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else{tellParent('enter');document.documentElement.requestFullscreen()}};document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;$('fullscreen').textContent=full?'🔳 退出全屏':'🖥️ 全屏演示';if(!full)tellParent('exit');resizeBoard()});const canvas=$('board'),ctx=canvas.getContext('2d');let drawing=false,boardOn=false;function resizeBoard(){canvas.width=innerWidth;canvas.height=innerHeight}canvas.onpointerdown=e=>{if(!boardOn)return;drawing=true;ctx.beginPath();ctx.moveTo(e.clientX,e.clientY)};canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(e.clientX,e.clientY);ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke()};canvas.onpointerup=()=>drawing=false;$('toggleBoard').onclick=()=>{boardOn=!boardOn;canvas.style.display=boardOn?'block':'none';document.body.classList.toggle('board-on',boardOn);$('toggleBoard').classList.toggle('active',boardOn);$('toggleBoard').textContent=boardOn?'✕ 关闭白板':'🖌️ 开启白板'};$('clearBoard').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);addEventListener('resize',resizeBoard);resizeBoard();selfCheck();load(new URLSearchParams(location.search).get('mode')||'interval');
</script></body></html>
