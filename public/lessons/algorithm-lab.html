    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#e0c3fc,#8ec5fc);user-select:none}.wrapper{height:100%;padding:16px 24px 20px}.app{height:100%;max-width:1600px;margin:auto;display:flex;flex-direction:column;gap:16px}.glass{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.65);border-radius:16px;box-shadow:0 8px 24px rgba(31,38,135,.09)}
    header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;color:#fff;border-radius:16px;background:linear-gradient(135deg,rgba(2,132,199,.96),rgba(14,165,233,.96));box-shadow:0 8px 22px rgba(2,132,199,.2)}h1{font-size:22px;margin:0}.subtitle{margin-top:4px;font-size:13px;opacity:.9}.tag{display:inline-flex;align-items:center;padding:6px 11px;border-radius:999px;background:rgba(15,23,42,.18);font-size:12px}.full{border:2px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
    .content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,38%) 1fr;gap:16px}.code-window{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:#1e1e1e;box-shadow:0 8px 24px rgba(0,0,0,.17)}.code-head{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#2d2d2d;color:#9ca3af;font-size:13px}.dot{width:12px;height:12px;border-radius:50%}.dot.r{background:#ef4444}.dot.y{background:#f59e0b}.dot.g{background:#10b981}.code-title{margin-left:8px}.complexity{margin-left:auto;color:#fbbf24}.code{flex:1;overflow:auto;padding:12px 0;color:#d4d4d4;font:14px/1.75 Consolas,monospace;counter-reset:line}.line{position:relative;white-space:pre;padding:2px 14px 2px 54px;border-left:4px solid transparent}.line:before{counter-increment:line;content:counter(line);position:absolute;left:5px;width:34px;padding-right:7px;text-align:right;color:#64748b;border-right:1px solid #475569}.line.on{color:#fff;background:rgba(245,158,11,.18);border-left-color:var(--amber)}
    .right{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}.stage{position:relative;flex:1;min-height:300px;padding:18px;display:flex;flex-direction:column}.stage-title{display:flex;align-items:center;justify-content:space-between;font-weight:800}.step-pill{font-size:12px;color:#0369a1;background:#e0f2fe;padding:5px 9px;border-radius:999px}.visual{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:16px}.caption{flex:none;min-height:62px;border-left:4px solid var(--amber);border-radius:9px;background:#fffbeb;padding:11px 14px;color:#475569;font-size:14px;line-height:1.6}.caption b{color:#b45309}
    .controls{flex:none;padding:12px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer}.btn:hover{border-color:#38bdf8;color:#0369a1}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.progress{flex:1;min-width:130px;accent-color:var(--blue)}select{border:1px solid #cbd5e1;border-radius:7px;padding:7px;background:#fff;color:#475569}
    .array{width:min(720px,100%);height:240px;display:flex;align-items:flex-end;justify-content:center;gap:12px}.bar{width:64px;min-height:45px;border:2px solid #7dd3fc;border-radius:10px 10px 4px 4px;background:linear-gradient(#e0f2fe,#bae6fd);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;color:#0369a1;font-weight:800;transition:.35s}.bar.active{transform:translateY(-12px);border-color:var(--amber);background:#fef3c7;color:#b45309;box-shadow:0 8px 18px rgba(245,158,11,.2)}.bar.done{border-color:#34d399;background:#d1fae5;color:#047857}.index{text-align:center;font-size:11px;color:#94a3b8;margin-top:5px}
    .cells{display:grid;gap:7px}.cell{min-width:44px;height:42px;padding:0 8px;display:grid;place-items:center;border:2px solid #bae6fd;border-radius:7px;background:#fff;color:#0369a1;font-weight:800;transition:.3s}.cell.active{border-color:var(--amber);background:#fef3c7;color:#b45309;transform:scale(1.08)}.cell.done{border-color:#34d399;background:#d1fae5;color:#047857}.cell-label{border:0;background:transparent;color:#64748b;font-size:12px}.string-row{display:flex;gap:7px;justify-content:center;margin:10px}.string-wrap{text-align:center}.string-name{font-size:12px;color:#64748b;margin-bottom:6px}.math{max-width:760px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}.formula{padding:14px 18px;border:2px solid #bae6fd;border-radius:12px;background:#fff;color:#075985;font:700 18px Consolas,monospace}.formula.active{border-color:var(--amber);background:#fffbeb;color:#b45309}.arrow{color:#94a3b8;font-size:24px}.sets{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.set{min-width:120px;padding:12px;border:2px solid #bae6fd;border-radius:14px;background:#fff;text-align:center}.set.active{border-color:var(--amber);background:#fffbeb}.set.done{border-color:#34d399;background:#ecfdf5}.set strong{display:block;color:#0369a1;margin-bottom:8px}.tokens{display:flex;justify-content:center;gap:6px}.token{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#e0f2fe;color:#0369a1;font-weight:800}.graph{width:min(700px,100%);height:300px}.edge{stroke:#94a3b8;stroke-width:3}.edge.on{stroke:var(--amber);stroke-width:6}.node{fill:#fff;stroke:#38bdf8;stroke-width:4}.node.on{fill:#fef3c7;stroke:var(--amber)}.node.done{fill:#d1fae5;stroke:var(--green)}.node-text{font-size:16px;font-weight:800;text-anchor:middle;dominant-baseline:middle;fill:#0f172a}.weight{font-size:12px;fill:#64748b}.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:#64748b}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
    @media(max-width:900px){body{overflow:auto;height:auto;min-height:100vh}.wrapper{height:auto;padding:10px}.app{min-height:100vh}.content{grid-template-columns:1fr}.code-window{height:380px}.stage{min-height:480px}.controls{position:sticky;bottom:0}.header-extra{display:none}}@media(max-width:520px){.wrapper{padding:6px}header{padding:10px 13px}h1{font-size:18px}.content{gap:10px}.array{gap:5px}.bar{width:45px}.controls .label{display:none}}

<body><div class="wrapper"><div class="app">
  <header><div><h1 id="title">算法互动演练</h1><div class="subtitle" id="subtitle"></div></div><div style="display:flex;align-items:center;gap:10px"><span class="tag header-extra" id="familyTag">课堂可视化</span><button class="full" id="fullscreen">⛶ 全屏</button></div></header>
  <div class="content"><section class="code-window"><div class="code-head"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="code-title">C++ 核心伪代码</span><span class="complexity" id="complexity"></span></div><div class="code" id="code"></div></section>
    <div class="right"><section class="stage glass"><div class="stage-title"><span>状态变化</span><span class="step-pill" id="stepPill"></span></div><div class="visual" id="visual"></div><div class="caption"><b id="stepTitle"></b><span id="note"></span></div></section>
      <section class="controls glass"><button class="btn" id="prev">← 上一步</button><button class="btn primary" id="play">▶ 自动播放</button><button class="btn" id="next">下一步 →</button><button class="btn" id="reset">↻ 重置</button><input class="progress" id="progress" type="range" min="0" value="0"><span class="label" style="font-size:12px;color:#64748b">速度</span><select id="speed"><option value="1600">慢速</option><option value="950" selected>正常</option><option value="520">快速</option></select></section>
    </div></div>
</div></div>
<script>
const C={};
function add(name,family,complexity,idea,code,notes){C[name]={name,family,complexity,idea,code:code.split('|'),notes:notes.split('|')}}
add('二分查找','array','O(log n)','维护一个仍可能包含答案的闭区间，每次检查中点并排除一半。','int l = 0, r = n - 1;|while (l <= r) {|  int mid = (l + r) / 2;|  if (a[mid] == x) return mid;|  if (a[mid] < x) l = mid + 1;|  else r = mid - 1;|}','确定初始搜索区间 [0, 5]|检查中点 a[2]，目标更小|右边界移动到 mid - 1|检查新中点 a[0]|目标更大，左边界右移|在 a[1] 找到目标');
add('二分答案','array','O(log V · check)','答案具有单调性时，二分答案并用 check 判断是否可行。','while (l < r) {|  int mid = (l + r) / 2;|  if (check(mid)) r = mid;|  else l = mid + 1;|}|return l;','确定答案范围|尝试中间答案 mid|运行 check(mid)|当前方案可行，压缩右半区|再次取中点验证|左右边界重合，得到最优答案');
add('实数二分','math','O(log((R-L)/eps))','在连续区间中反复取中点，直到区间长度小于精度要求。','for (int i = 0; i < 100; i++) {|  double mid = (l + r) / 2;|  if (f(mid) < target) l = mid;|  else r = mid;|}|return (l + r) / 2;','从 [0, 4] 开始逼近|计算中点 2.000|比较 f(mid) 与目标|保留可能含根的一半|区间继续缩小|达到精度要求');
add('一维前缀和','array','预处理 O(n)，查询 O(1)','用 s[i] 保存前 i 个数的和，区间和等于两个前缀之差。','s[0] = 0;|for (int i = 1; i <= n; i++)|  s[i] = s[i-1] + a[i];|int rangeSum(int l, int r) {|  return s[r] - s[l-1];|}','从空前缀 s[0] 开始|加入第一个元素|依次累加得到 s[i]|完成整列前缀和|选择查询区间 [2,5]|用 s[5]-s[1] 得到区间和');
add('二维前缀和','grid','预处理 O(nm)，查询 O(1)','用容斥维护左上矩形和，再用四个前缀值回答矩形查询。','s[i][j] = a[i][j]|  + s[i-1][j] + s[i][j-1]|  - s[i-1][j-1];|ans = s[x2][y2] - s[x1-1][y2]|    - s[x2][y1-1] + s[x1-1][y1-1];','建立左上角前缀区域|横向加入新格子|纵向加入已有区域|减去被重复统计部分|框选目标矩形|四个前缀量完成容斥');
add('差分','array','修改 O(1)，还原 O(n)','区间加法只修改两个端点，最后求一次前缀和还原数组。','d[1] = a[1];|d[i] = a[i] - a[i-1];|d[l] += value;|d[r+1] -= value;|for (int i=1;i<=n;i++)|  a[i] = a[i-1] + d[i];','由原数组建立差分数组|选定区间 [2,4]|在左端点加上增量|在右端点后一位减去增量|对差分数组求前缀和|一次还原全部区间修改');
add('区间贪心','array','O(n log n)','按右端点排序，每次选择最早结束且不冲突的区间。','sort(seg, byRightEndpoint);|int last = -INF;|for (auto [l,r] : seg) {|  if (l >= last) {|    choose(l,r); last = r;|  }|}','按右端点从小到大排列|选择最早结束的区间|跳过与已选区间冲突者|继续扫描下一个候选|再次选择不冲突区间|得到数量最大的可兼容集合');
add('构造贪心','array','通常 O(n log n)','每一步选择不会破坏后续可行性的局部最优决策。','sort(items.begin(), items.end());|for (auto item : items) {|  if (safe(item, state)) {|    take(item);|    update(state);|  }|}','整理候选元素|选择当前代价最小者|验证选择仍保持可行|更新剩余状态|重复局部最优决策|构造出完整答案');
add('DFS','graph','O(V+E)','沿一条分支不断深入，走不通时回退到上一个节点。','void dfs(int u) {|  vis[u] = true;|  for (int v : g[u])|    if (!vis[v])|      dfs(v);|}','从起点 A 入栈|访问相邻点 B|沿分支继续深入 D|D 无新邻点，开始回退|转向另一条分支 C|所有可达点访问完成');
add('回溯法','tree','与搜索树规模有关','选择、递归、撤销选择，系统枚举搜索树中的可行方案。','void search(int depth) {|  if (complete()) save();|  for (auto choice : choices) {|    make(choice);|    search(depth + 1);|    undo(choice);|  }|}','从空方案开始|做出第一个选择|进入下一层继续选择|发现冲突，当前分支失败|撤销上一步选择|换一条分支找到可行解');
add('剪枝','tree','取决于剪枝效果','利用上下界或可行性提前停止不可能产生答案的分支。','void dfs(State s) {|  if (!possible(s)) return;|  if (bound(s) <= best) return;|  if (complete(s)) update();|  for (auto next : expand(s))|    dfs(next);|}','展开根状态|计算各分支的可行性|深入有希望的左分支|更新当前最优答案|右分支上界不超过最优值|剪去整棵无效子树');
add('BFS','graph','O(V+E)','使用队列按距离分层扩展，第一次到达即得到无权图最短距离。','queue<int> q; q.push(s);|dist[s] = 0;|while (!q.empty()) {|  int u = q.front(); q.pop();|  for (int v : g[u]) if (dist[v]<0) {|    dist[v]=dist[u]+1; q.push(v);|  }|}','起点 A 进入队列|扩展距离为 1 的 B、C|A 出队，B 成为队首|从 B 发现 D|从 C 发现 E|按层完成全部访问');
add('双向 BFS','graph','约 O(b^(d/2))','同时从起点和终点扩展，总是扩展较小的一侧，直到两边相遇。','frontA = {start}; frontB = {target};|while (!frontA.empty() && !frontB.empty()) {|  if (frontA.size() > frontB.size()) swap(frontA,frontB);|  frontA = expand(frontA);|  if (intersects(frontA, frontB)) break;|}','从 A 与 F 同时出发|A 侧扩展到 B、C|F 侧扩展到 E|继续扩展较小的一侧|两侧在 D 相遇|拼接得到最短路径');
add('状态压缩 BFS','set','O(状态数 × 转移数)','用一个整数的二进制位表示复合状态，再在状态图上分层搜索。','queue<int> q; q.push(startMask);|while (!q.empty()) {|  int mask = q.front(); q.pop();|  for (int next : transitions(mask))|    if (!vis[next]) {|      vis[next]=1; q.push(next);|    }|}','把开关状态编码为 0001|执行一次合法转移得到 0011|新状态进入队列|继续翻转得到 0111|过滤已经访问的状态|首次到达目标状态 1111');
add('0/1 背包','grid','O(nW)','每件物品只能取一次，容量必须倒序更新以避免重复取用。','for (auto [w,v] : items)|  for (int j = W; j >= w; j--)|    dp[j] = max(dp[j], dp[j-w] + v);','初始化容量状态|考虑第一件物品|从大容量向小容量更新|比较不选与选择的价值|加入下一件物品|得到容量 W 的最大价值');
add('完全背包','grid','O(nW)','每件物品可重复选择，容量正序更新以复用本轮状态。','for (auto [w,v] : items)|  for (int j = w; j <= W; j++)|    dp[j] = max(dp[j], dp[j-w] + v);','初始化 dp 数组|处理第一种物品|容量正序更新|同种物品可以再次贡献|处理下一种物品|完成所有容量的最优值');
add('多重背包','grid','O(nW log C)','将有限件物品二进制拆分，再转化为若干个 0/1 背包物品。','for (int k=1; count>0; k<<=1) {|  int take = min(k, count);|  add01Item(take*w, take*v);|  count -= take;|}|run01Knapsack();','读取物品数量限制|按 1 件拆出第一组|按 2 件拆出第二组|处理剩余数量|得到若干 0/1 物品|倒序更新背包状态');
add('最长上升子序列','array','O(n log n)','维护每种长度的最小结尾，用二分替换得到 LIS 长度。','vector<int> tails;|for (int x : a) {|  auto it = lower_bound(tails,x);|  if (it == tails.end()) tails.push_back(x);|  else *it = x;|}','空的 tails 表开始|第一个元素形成长度 1|更大元素扩展序列|较小元素替换同长度结尾|继续二分寻找替换位置|tails 长度就是 LIS 长度');
add('最长公共子序列','grid','O(nm)','dp[i][j] 表示两个前缀的 LCS 长度，相等时从左上转移。','if (a[i] == b[j])|  dp[i][j] = dp[i-1][j-1] + 1;|else|  dp[i][j] = max(dp[i-1][j], dp[i][j-1]);','建立两个字符串的二维状态表|比较第一对字符|相等时取左上角加一|不等时取上方与左侧最大值|逐行填满状态表|右下角得到 LCS 长度');
add('树的最大独立集','tree','O(n)','每个节点维护选与不选两种状态，自底向上合并子树。','dfs(u, parent);|take[u] = weight[u]; skip[u] = 0;|for (int v : child[u]) {|  take[u] += skip[v];|  skip[u] += max(take[v],skip[v]);|}','从叶节点开始计算|叶子选择状态等于自身权值|父节点若选，则孩子不能选|父节点不选，可取孩子最优|逐层向根合并|根节点两种状态取最大值');
add('树上背包','tree','O(nW²)','对子树逐个合并容量，类似在树结构上做分组背包。','dfs(u); dp[u][1] = value[u];|for (int v : child[u]) {|  dfs(v);|  for (int j=W;j>=1;j--)|    for (int k=1;k<j;k++)|      dp[u][j]=max(dp[u][j],dp[u][j-k]+dp[v][k]);|}','初始化叶子子树|计算第一个孩子的容量表|把孩子状态合并到父亲|枚举容量如何分给两棵子树|继续合并其他孩子|根节点得到全树答案');
add('朴素匹配','string','O(nm)','让模式串从文本的每个位置开始逐字符比较。','for (int i=0; i+m<=n; i++) {|  int j = 0;|  while (j<m && text[i+j]==pat[j]) j++;|  if (j==m) return i;|}','模式串与文本起点对齐|逐字符比较前缀|出现失配|模式串右移一位|再次逐字符比较|全部字符相等，匹配成功');
add('Z 函数','string','O(n)','z[i] 表示从 i 开始的后缀与原串的最长公共前缀长度。','for (int i=1,l=0,r=0;i<n;i++) {|  if (i<=r) z[i]=min(r-i+1,z[i-l]);|  while (i+z[i]<n && s[z[i]]==s[i+z[i]]) z[i]++;|  if (i+z[i]-1>r) l=i,r=i+z[i]-1;|}','从位置 1 开始比较前缀|扩展得到第一个 Z 值|记录当前最右匹配盒 [l,r]|盒内位置复用已有答案|必要时继续向右扩展|得到所有位置的 Z 值');
add('多项式哈希','string','预处理 O(n)，查询 O(1)','把字符串看作某个进制的多项式，使用前缀哈希求子串指纹。','h[i] = h[i-1] * base + s[i];|power[i] = power[i-1] * base;|hash(l,r) = h[r] - h[l-1]*power[r-l+1];','选择基数 base|读入第一个字符|滚动计算前缀哈希|保存 base 的各次幂|截取两个待比较子串|O(1) 求出并比较哈希值');
add('双哈希','string','预处理 O(n)，查询 O(1)','使用两组模数或基数同时计算指纹，显著降低碰撞概率。','h1 = buildHash(mod1, base1);|h2 = buildHash(mod2, base2);|bool equal(l1,r1,l2,r2) {|  return get(h1,l1,r1)==get(h1,l2,r2)|      && get(h2,l1,r1)==get(h2,l2,r2);|}','计算第一组前缀哈希|计算第二组前缀哈希|截取第一个子串的双指纹|截取第二个子串的双指纹|两组结果分别比较|两组都相等才认为子串相同');
add('快速幂','math','O(log b)','按指数二进制位决定是否乘入答案，并不断平方底数。','long long ans = 1;|while (b > 0) {|  if (b & 1) ans = ans * a % mod;|  a = a * a % mod;|  b >>= 1;|}','把指数 13 写成二进制 1101|最低位为 1，答案乘 a|底数平方，指数右移|当前位为 0，只平方|继续处理下一位|合并得到 a^13');
add('最大公约数','math','O(log min(a,b))','利用 gcd(a,b)=gcd(b,a mod b) 不断缩小问题。','int gcd(int a, int b) {|  while (b != 0) {|    int r = a % b;|    a = b; b = r;|  }|  return a;|}','从 gcd(48,18) 开始|48 除以 18 余 12|转为 gcd(18,12)|18 除以 12 余 6|转为 gcd(12,6)|余数为 0，答案是 6');
add('质数筛','array','O(n log log n)','从小到大筛去每个质数的倍数，留下的就是质数。','isPrime.assign(n+1, true);|for (int p=2; p*p<=n; p++)|  if (isPrime[p])|    for (int x=p*p; x<=n; x+=p)|      isPrime[x] = false;','先假设 2 到 n 都是质数|找到第一个质数 2|划去 2 的所有倍数|下一个未被划去的是 3|划去 3 的倍数|剩余未标记数字均为质数');
add('模逆元','math','O(log mod)','在模意义下寻找 a⁻¹，使 a·a⁻¹≡1；质数模可用快速幂。','long long inverse(long long a) {|  return qpow(a, mod - 2, mod);|}|// a * inverse(a) % mod == 1','确认 a 与模数互质|应用费马小定理|把逆元转成 a^(p-2)|用快速幂计算|结果乘回原数验证|模意义下得到 1');
add('排列组合','math','预处理 O(n)，查询 O(1)','预处理阶乘与逆阶乘，快速计算组合数。','fac[0] = 1;|for (int i=1;i<=n;i++) fac[i]=fac[i-1]*i%mod;|ifac[n] = inverse(fac[n]);|for (int i=n;i;i--) ifac[i-1]=ifac[i]*i%mod;|C(n,m)=fac[n]*ifac[m]%mod*ifac[n-m]%mod;','计算阶乘表|求最大阶乘的逆元|倒推逆阶乘表|读取 n 与 m|代入组合数公式|得到 C(n,m)');
add('容斥原理','set','O(2^k)','先相加各集合大小，再减去两两交集，继续交替修正重复计数。','answer = 0;|for (int mask=1; mask<(1<<k); mask++) {|  value = intersection(mask);|  if (popcount(mask)&1) answer += value;|  else answer -= value;|}','先统计集合 A|加上集合 B|交集 A∩B 被重复计算|减去两集合交集|三集合交集需要再次加回|交替加减得到并集大小');
add('单调栈与单调队列','set','O(n)','维护元素单调性，及时删除不可能成为答案的候选。','for (int i=0;i<n;i++) {|  while (!st.empty() && a[st.top()] <= a[i]) st.pop();|  answer[i] = st.empty() ? -1 : st.top();|  st.push(i);|}','空栈开始扫描|第一个元素入栈|较小元素保持单调并入栈|更大元素弹出失效候选|记录当前最近更大元素|所有元素至多进出一次');
add('二叉堆','tree','插入/删除 O(log n)','完全二叉树保持堆序性质，通过上浮和下沉维护最值。','heap.push_back(x);|for (int i=size-1; i>1 && heap[i]<heap[i/2]; i/=2)|  swap(heap[i],heap[i/2]);|pop: swap(root,last);|siftDown(root);','新元素放到完全二叉树末尾|与父节点比较|违反堆序，向上交换|继续上浮到合适位置|删除堆顶并移入末元素|向下调整恢复小根堆');
add('并查集','set','近似 O(1)','用父指针维护集合，路径压缩和按秩合并降低树高。','int find(int x) {|  return parent[x]==x ? x : parent[x]=find(parent[x]);|}|void unite(int a,int b) {|  a=find(a); b=find(b);|  if(a!=b) parent[b]=a;|}','每个元素起初独立成集合|查询 1 与 2 的根|合并两个集合|再合并 3 所在集合|find 时把路径直接指向根|快速判断两点是否连通');
add('树状数组','array','修改/查询 O(log n)','利用 lowbit 管理若干前缀区间，支持单点修改与前缀查询。','void add(int x,int v){|  for(;x<=n;x+=x&-x) bit[x]+=v;|}|int sum(int x){|  int s=0; for(;x;x-=x&-x) s+=bit[x];|  return s;|}','定位单点修改位置|加到当前树状数组节点|通过 lowbit 跳到父区间|完成所有覆盖区间更新|查询时反向跳转|累加得到前缀和');
add('线段树','tree','修改/查询 O(log n)','把区间递归二分，每个节点维护所代表区间的聚合信息。','void build(p,l,r) {|  if(l==r){tree[p]=a[l];return;}|  int m=(l+r)/2; build(p*2,l,m); build(p*2+1,m+1,r);|  tree[p]=tree[p*2]+tree[p*2+1];|}','根节点代表完整区间|递归二分为左右区间|到达叶节点保存单个值|向上合并左右孩子|查询时只进入相交区间|合并得到目标区间答案');
add('ST 表','grid','预处理 O(n log n)，查询 O(1)','预处理长度为 2^k 的区间最值，查询用两个重叠块覆盖。','st[i][0] = a[i];|for (int k=1;(1<<k)<=n;k++)|  for (int i=1;i+(1<<k)-1<=n;i++)|    st[i][k]=max(st[i][k-1],st[i+(1<<(k-1))][k-1]);|query(l,r): k=log2(r-l+1);|return max(st[l][k],st[r-(1<<k)+1][k]);','初始化长度为 1 的区间|合并得到长度为 2 的答案|继续得到长度为 4 的答案|选定静态查询区间|找最大可用的 2 次幂|两个区间块覆盖并取最值');
add('邻接矩阵与邻接表','graph','建图 O(E)','矩阵适合稠密图，邻接表只存存在的边，适合稀疏图。','matrix[u][v] = weight;|adj[u].push_back({v,weight});|for (auto [v,w] : adj[u]) {|  // 枚举 u 的出边|}','读取一条边 A-B|在矩阵对应位置记录权值|同时加入 A 的邻接表|继续加入其余边|从 A 枚举相邻顶点|对比两种存储的空间开销');
add('图上的 DFS / BFS','graph','O(V+E)','DFS 深入分支，BFS 按层扩展；二者都依赖 visited 避免重复。','vis[start] = true;|container.push(start);|while (!container.empty()) {|  int u = take();|  for (int v : g[u]) if (!vis[v]) {|    vis[v]=true; container.push(v);|  }|}','选定遍历起点 A|标记并放入容器|取出一个节点枚举邻边|发现新的未访问节点|根据栈或队列决定次序|访问整个连通块');
add('Dijkstra','graph','O((V+E)log V)','每次确定当前距离最小的未确定点，并松弛其非负权出边。','dist[s]=0; pq.push({0,s});|while(!pq.empty()) {|  auto [d,u]=pq.top(); pq.pop();|  if(d!=dist[u]) continue;|  for(auto [v,w]:g[u]) if(dist[v]>d+w){|    dist[v]=d+w; pq.push({dist[v],v});|  }|}','起点 A 距离设为 0|取出当前最近点 A|松弛 A 的所有出边|确定距离最小的 B|通过 B 更新 D 的距离|依次确定所有最短距离');
add('Bellman-Ford / SPFA','graph','Bellman-Ford O(VE)','允许负边，通过反复松弛边传播最短距离，并可检测负环。','dist[s]=0;|for(int i=1;i<n;i++)|  for(auto [u,v,w]:edges)|    dist[v]=min(dist[v],dist[u]+w);|// 第 n 轮仍可松弛则有负环','初始化起点距离|第一轮扫描所有边|部分最短路向外传播|继续扫描使信息经过更多边|第 n-1 轮后正常收敛|额外一轮检查负环');
add('Floyd-Warshall','grid','O(V³)','依次允许每个点作为中转，更新任意两点之间的最短距离。','for(int k=0;k<n;k++)|  for(int i=0;i<n;i++)|    for(int j=0;j<n;j++)|      d[i][j]=min(d[i][j],d[i][k]+d[k][j]);','初始化直接边距离矩阵|允许 A 作为中转点|尝试更新每一对顶点|允许 B 作为新中转点|继续动态规划更新矩阵|得到全源最短路');
add('Kruskal','graph','O(E log E)','按边权排序，用并查集选择连接不同连通块的边。','sort(edges.begin(),edges.end());|for(auto [w,u,v]:edges) {|  if(find(u)!=find(v)) {|    unite(u,v); mst += w;|  }|}','按权值从小到大排列边|选择最小且不成环的边|并查集合并两个端点|跳过会形成环的边|继续选择连接不同块的边|选满 n-1 条边得到 MST');
add('Prim','graph','O((V+E)log V)','从一个点出发，每次选择连接树内与树外的最小边。','used[start]=true; pushEdges(start);|while(edgeCount<n-1) {|  auto [w,u,v]=pq.top(); pq.pop();|  if(used[v]) continue;|  take(u,v); used[v]=true; pushEdges(v);|}','从 A 建立初始树|考察所有跨越切分的边|选择最小边 A-B|把 B 加入生成树|更新候选边集合|所有顶点被最小代价连接');
add('最小生成树性质','graph','切分性质','任意切分中，跨越切分的最小边一定属于某棵最小生成树。','split vertices into S and V-S;|e = minimum crossing edge;|// e is safe|add e to MST;|merge the two components;','把顶点分为两个集合|找出所有跨越切分的边|选择其中权值最小者|根据切分性质，该边是安全边|合并两个连通块|重复直到形成生成树');
add('强连通分量','graph','O(V+E)','Tarjan 用 dfn 与 low 值识别有向图中互相可达的极大点集。','dfn[u]=low[u]=++timer; stack.push(u);|for(int v:g[u]) {|  if(!dfn[v]) dfs(v),low[u]=min(low[u],low[v]);|  else if(inStack[v]) low[u]=min(low[u],dfn[v]);|}|if(low[u]==dfn[u]) popSCC(u);','DFS 首次访问 A 并入栈|沿有向边深入 B、C|返祖边使 low 值降低|回溯并传播 low 值|发现 low[u]=dfn[u] 的根|从栈弹出一个强连通分量');
add('割点与桥','graph','O(V+E)','DFS 树中用 low 值判断子树能否绕过父边回到祖先。','dfn[u]=low[u]=++timer;|for(int v:g[u]) if(!dfn[v]) {|  dfs(v,u); low[u]=min(low[u],low[v]);|  if(low[v]>=dfn[u]) u is cut;|  if(low[v]>dfn[u]) (u,v) is bridge;|}','建立 DFS 树|记录节点访问时间 dfn|返祖边更新 low 值|子树无法越过父节点|判断当前点为割点|严格无法越过父边则该边为桥');
add('分治','tree','常见 O(n log n)','把问题拆成较小的同类子问题，递归求解后合并答案。','solve(l,r) {|  if(l==r) return base(l);|  int mid=(l+r)/2;|  left=solve(l,mid); right=solve(mid+1,r);|  return merge(left,right);|}','接收完整问题区间|从中点拆成两半|继续递归拆分左半|到达最小子问题|逐层合并左右答案|得到原问题结果');
add('CDQ 分治','grid','O(n log² n)','按一个维度分治，在合并阶段用数据结构统计跨左右区间的贡献。','cdq(l,r) {|  if(l==r) return;|  int mid=(l+r)/2; cdq(l,mid); cdq(mid+1,r);|  sort left/right by y;|  use BIT to count cross contributions;|}','按第一维把点分成左右两半|递归处理左半内部贡献|递归处理右半内部贡献|两侧按第二维排序|树状数组统计跨区贡献|清理数据结构并完成合并');
add('莫队','array','O((n+q)√n)','按左端点分块、右端点排序查询，通过移动当前区间复用答案。','sort(query, moOrder);|int L=1,R=0;|for(auto [l,r,id]:query) {|  while(L>l) add(--L); while(R<r) add(++R);|  while(L<l) del(L++); while(R>r) del(R--);|  ans[id]=current;|}','按莫队顺序重排查询|当前区间从空开始|移动右端点加入元素|移动左端点删除元素|记录当前查询答案|小幅移动到下一个查询区间');

const graphNodes=[['A',90,145],['B',230,65],['C',230,225],['D',420,65],['E',420,225],['F',590,145]], graphEdges=[[0,1,4],[0,2,2],[1,2,1],[1,3,5],[2,4,4],[3,4,1],[3,5,3],[4,5,2]];
const params=new URLSearchParams(location.search), requested=params.get('algorithm')||'二分查找', A=C[requested]||C['二分查找'];let step=0,timer=null;
const $=id=>document.getElementById(id);$('title').textContent=A.name+' · 互动演练';$('subtitle').textContent=A.idea;$('complexity').textContent=A.complexity;$('familyTag').textContent=({array:'序列',grid:'动态规划 / 表格',graph:'图论',tree:'树与递归',string:'字符串',math:'数学推导',set:'集合 / 状态'})[A.family]||'课堂可视化';document.title=A.name+' - 信奥算法互动演练';
function renderCode(){const box=$('code');box.innerHTML='';A.code.forEach((s,i)=>{const d=document.createElement('div');d.className='line '+(i===Math.min(step,A.code.length-1)?'on':'');d.textContent=s;box.appendChild(d)})}
function renderArray(){const vals=A.name==='质数筛'?[2,3,4,5,6,7,8,9,10]:[7,2,9,4,1,6];const active=step%vals.length;return '<div><div class="array">'+vals.map((v,i)=>'<div><div class="bar '+(i===active?'active ':'')+(i<Math.max(0,step-1)?'done':'')+'" style="height:'+(55+v*16)+'px">'+v+'</div><div class="index">'+i+'</div></div>').join('')+'</div><div class="legend"><span><i style="background:#f59e0b"></i>当前操作</span><span><i style="background:#10b981"></i>已处理</span></div></div>'}
function renderGrid(){let n=5,m=7,c=0,s='<div class="cells" style="grid-template-columns:repeat('+m+',44px)">';for(let i=0;i<n;i++)for(let j=0;j<m;j++,c++){let done=c<step*6,active=c>=step*6&&c<step*6+6;s+='<div class="cell '+(active?'active ':done?'done':'')+'">'+(i===0||j===0?Math.max(i,j):(i*j+step)%10)+'</div>'}return s+'</div>'}
function renderString(){const t='ABABACABA',p=A.name.includes('哈希')?'ABAC':A.name==='Z 函数'?'ABABA':'ABAC';let shift=Math.min(step,5);const row=(str,label,off)=>'<div class="string-wrap"><div class="string-name">'+label+'</div><div class="string-row" style="margin-left:'+off*51+'px">'+[...str].map((x,i)=>'<div class="cell '+(i===step%str.length?'active ':'')+(i<step%str.length?'done':'')+'">'+x+'</div>').join('')+'</div></div>';return '<div>'+row(t,'文本 / 原串',0)+row(p,'模式 / 当前前缀',shift)+'</div>'}
function renderMath(){return '<div class="math">'+A.notes.map((n,i)=>'<div class="formula '+(i===step?'active':'')+'">'+(i+1)+'</div>'+(i<A.notes.length-1?'<span class="arrow">→</span>':'')).join('')+'</div>'}
function renderSets(){const groups=[[1,2],[3],[4,5],[6]];return '<div class="sets">'+groups.map((g,i)=>'<div class="set '+(i===step%groups.length?'active ':'')+(i<step%groups.length?'done':'')+'"><strong>'+(A.family==='set'?'状态 / 集合 ':'候选 ')+(i+1)+'</strong><div class="tokens">'+g.map(x=>'<span class="token">'+x+'</span>').join('')+'</div></div>').join('')+'</div>'}
function renderTree(){const nodes=[['1',350,35],['2',205,120],['3',495,120],['4',125,225],['5',285,225],['6',430,225],['7',570,225]],edges=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];return '<svg class="graph" viewBox="0 0 700 280">'+edges.map((e,i)=>'<line class="edge '+(i<step?'on':'')+'" x1="'+nodes[e[0]][1]+'" y1="'+nodes[e[0]][2]+'" x2="'+nodes[e[1]][1]+'" y2="'+nodes[e[1]][2]+'"/>').join('')+nodes.map((n,i)=>'<circle class="node '+(i===step?'on ':i<step?'done':'')+'" cx="'+n[1]+'" cy="'+n[2]+'" r="27"/><text class="node-text" x="'+n[1]+'" y="'+n[2]+'">'+n[0]+'</text>').join('')+'</svg>'}
function renderGraph(){return '<svg class="graph" viewBox="0 0 680 290">'+graphEdges.map((e,i)=>{const a=graphNodes[e[0]],b=graphNodes[e[1]];return '<line class="edge '+(i<step?'on':'')+'" x1="'+a[1]+'" y1="'+a[2]+'" x2="'+b[1]+'" y2="'+b[2]+'"/><text class="weight" x="'+((a[1]+b[1])/2)+'" y="'+((a[2]+b[2])/2-7)+'">'+e[2]+'</text>'}).join('')+graphNodes.map((n,i)=>'<circle class="node '+(i===step?'on ':i<step?'done':'')+'" cx="'+n[1]+'" cy="'+n[2]+'" r="25"/><text class="node-text" x="'+n[1]+'" y="'+n[2]+'">'+n[0]+'</text>').join('')+'</svg>'}
function render(){step=Math.max(0,Math.min(step,A.notes.length-1));renderCode();$('visual').innerHTML=({array:renderArray,grid:renderGrid,string:renderString,math:renderMath,set:renderSets,tree:renderTree,graph:renderGraph}[A.family]||renderArray)();$('stepPill').textContent='第 '+(step+1)+' / '+A.notes.length+' 步';$('stepTitle').textContent='步骤 '+(step+1)+'：';$('note').textContent=A.notes[step];$('progress').max=A.notes.length-1;$('progress').value=step;$('prev').disabled=step===0;$('next').disabled=step===A.notes.length-1}
function tellParent(action){if(window.parent!==window)window.parent.postMessage({type:'lesson-fullscreen',action},location.origin)}function stop(){if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 自动播放'}}function move(d){stop();step+=d;render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{stop();step=0;render()};$('progress').oninput=e=>{stop();step=+e.target.value;render()};$('play').onclick=()=>{if(timer){stop();return}$('play').textContent='Ⅱ 暂停';timer=setInterval(()=>{if(step>=A.notes.length-1){stop();return}step++;render()},+$('speed').value)};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else{tellParent('enter');document.documentElement.requestFullscreen()}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)tellParent('exit')});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '){e.preventDefault();$('play').click()}});render();
</script></body></html>
