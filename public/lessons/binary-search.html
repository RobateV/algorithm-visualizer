    .phase-strip{display:flex;justify-content:center;gap:8px;margin-bottom:10px}.phase{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#94a3b8;font-size:11px;font-weight:800}.phase.on{background:#fef3c7;color:#b45309}.phase.done{background:#d1fae5;color:#047857}@keyframes pulse{50%{transform:scale(1.08)}}
    .is-hidden{display:none!important}
    /* ===== 课堂三环节导航 ===== */

    /* ===== 环节一：原理讲解 ===== */

    .principle-title{margin:0;font-size:clamp(30px,3vw,46px);line-height:1.12;letter-spacing:-.5px}
    .principle-lead{max-width:68ch;margin:10px 0 0;color:#334155;font-size:clamp(18px,1.55vw,25px);font-weight:650;line-height:1.65}

    .principle-grid-3{grid-template-columns:minmax(0,1fr) minmax(0,1.18fr) minmax(0,.92fr)}
    .p-card{min-width:0;padding:clamp(14px,1.4vw,22px);border:1px solid #dbeafe;border-radius:14px;background:#fff;box-shadow:0 5px 14px rgba(2,132,199,.06)}

    .p-card p{margin:0;color:#334155;font-size:clamp(15px,1.08vw,18px);line-height:1.72}
    .p-card p + p{margin-top:8px}
    .p-label{display:inline-block;margin-bottom:7px;color:#0369a1;font-size:12.5px;font-weight:900;letter-spacing:.5px}
    .p-question{border-left:6px solid var(--amber);background:linear-gradient(180deg,#fffbeb,#fff)}
    .p-question .p-label{color:#b45309}
    .p-answer{padding-top:8px;border-top:1px dashed #fcd34d}
    .p-answer b{color:#92400e}
    .p-invariant{border-left:6px solid var(--blue)}
    .p-steps{margin:0;padding-left:1.35em;color:#334155;font-size:clamp(15px,1.08vw,18px);line-height:1.75}
    .p-steps li + li{margin-top:5px}
    .p-steps li::marker{color:var(--deep);font-weight:900}
    .example-list{display:flex;flex-direction:column;gap:8px}
    .example-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:clamp(13.5px,.98vw,16px);line-height:1.45}
    .example-row b{color:#0369a1}
    .example-row span{color:#475569}
    .example-row span:last-child{color:#64748b}
    .p-note{font-size:clamp(15px,1.08vw,18px)!important}
    .p-formula{margin-top:12px;padding:11px 12px;border-radius:10px;background:#0f172a;color:#fbbf24;font:800 clamp(15px,1.15vw,19px) Consolas,monospace;text-align:center;overflow-wrap:anywhere}
    .principle-next{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:4px;color:#475569;font-size:15px;font-weight:650}
    .stage-cta{padding:10px 18px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--deep),var(--blue));color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(2,132,199,.25)}
    .stage-cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(2,132,199,.3)}
    /* ===== 环节二 / 三：动画与代码工作台 ===== */
    .visual-title-wrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
    .stage-title{margin:0;color:#0369a1;font-size:clamp(20px,1.6vw,26px);line-height:1.25}
    .visual-sub{color:#64748b;font-size:13px;font-weight:700}
    .content.stage-2{grid-template-columns:1fr}
    .content.stage-2 .code-window{display:none}
    .content.stage-2 .visual-card{flex:1.18}
    .content.stage-2 .lower{flex:.4}
    .content.stage-3{grid-template-columns:minmax(380px,40%) 1fr}
    .content.stage-2 .visual-head,.content.stage-3 .visual-head{padding-bottom:10px}
    @media(max-width:1100px){.principle-grid,.principle-grid-3{grid-template-columns:1fr}.principle-mark{display:none}.content.stage-3{grid-template-columns:minmax(320px,42%) 1fr}}
    #board{position:fixed;inset:0;z-index:40;display:none;touch-action:none}.board-tools{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;gap:8px}.board-btn{border:0;border-radius:999px;background:#fff;padding:11px 16px;color:#334155;font-weight:800;box-shadow:0 6px 20px rgba(15,23,42,.18);cursor:pointer}.board-btn.active{background:#ef4444;color:#fff}.clear-btn{display:none}.board-on .clear-btn{display:block}
    @media(max-width:900px){body{height:auto;min-height:100vh;overflow:auto}.wrapper{height:auto;padding:10px}.app{min-height:100vh}.content,.content.stage-3{grid-template-columns:1fr}.code-window{height:420px}.right{min-height:680px}.subtitle{display:none}.lower{grid-template-columns:1fr}.trace,.tips{max-height:260px}.stagebar{align-items:flex-start;flex-direction:column}.stage-arrows{align-self:flex-end}.principle-panel{overflow:visible;padding:20px}.principle-lead{font-size:18px}}@media(max-width:560px){header{padding:10px 12px}h1{font-size:17px}.full-btn{display:none}.mode-select{max-width:170px}.array-row{gap:3px}.array-item{width:43px}.cell{height:48px;font-size:16px}.btn{min-width:88px;padding:8px}.wrapper{padding:5px}.metrics{gap:5px}.metric{min-width:70px}.stage-chip{padding:6px 10px 6px 6px;font-size:13px}.stage-chip .n{width:21px;height:21px}.stage-arrow{padding:7px 10px;font-size:12px}.principle-panel{padding:14px}.principle-title{font-size:27px}.principle-lead{font-size:16.5px}.example-row{grid-template-columns:1fr}.principle-next{align-items:flex-start;flex-direction:column}.stage-cta{width:100%}}
  </style>

<body><canvas id="board"></canvas><div class="wrapper"><div class="app">
  <header><div><h1>✨ 白学在线 - 二分算法全景演练 <span class="subtitle">边界、单调性与精度</span></h1></div><div class="head-actions"><select id="mode" class="mode-select"><option value="search">二分查找 (Binary Search)</option><option value="answer">二分答案 (Binary Answer)</option><option value="real">实数二分 (Real Binary)</option></select><button id="fullscreen" class="full-btn">🖥️ 全屏演示</button></div></header>
  <nav class="stagebar" aria-label="教学环节">
    <div class="stage-tabs" role="tablist" aria-label="课堂三环节">
      <button type="button" class="stage-chip active" data-stage="1" role="tab" aria-selected="true"><span class="n">1</span>原理讲解</button>
      <button type="button" class="stage-chip" data-stage="2" role="tab" aria-selected="false"><span class="n">2</span>动画演示</button>
      <button type="button" class="stage-chip" data-stage="3" role="tab" aria-selected="false"><span class="n">3</span>动画 + 代码</button>
    </div>
    <div class="stage-arrows">
      <button type="button" id="stagePrev" class="stage-arrow" disabled>← 上一环节</button>
      <button type="button" id="stageNext" class="stage-arrow">下一环节 →</button>
    </div>
  </nav>
  <section id="principle" class="principle-panel glass" aria-label="原理讲解"></section>
  <div id="content" class="content is-hidden"><section class="code-window"><div class="code-head"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span id="codeName" class="code-name"></span><span id="complexity" class="complexity"></span></div><div id="code" class="code"></div></section>
    <div class="right"><section class="visual-card glass"><div class="visual-head"><div class="visual-title-wrap"><h2 id="stageTitle" class="stage-title">动画演示</h2><span id="visualTitle" class="visual-sub">状态变化</span></div><span id="stepBadge" class="step-badge"></span></div><div id="stage" class="stage"></div><div class="controls"><button id="prev" class="btn">← 上一步</button><button id="reset" class="btn">重置状态</button><button id="next" class="btn primary">下一步 →</button></div></section>
      <div class="lower"><section class="trace glass"><h3>实时执行分析</h3><p id="description"></p></section><section class="tips glass"><h3>💡 算法答题思路与核心提炼</h3><div id="tips" class="tips-content"></div></section></div>
    </div></div>
</div></div><div class="board-tools"><button id="clearBoard" class="board-btn clear-btn">清空</button><button id="toggleBoard" class="board-btn">🖌️ 开启白板</button></div>
<script>
const MODES={
 search:{name:'二分查找',file:'binary_search.cpp',complexity:'O(log n)',visual:'有序数组与闭区间 [l, r]',tips:'<b>循环不变量：</b>答案如果存在，始终位于闭区间 <code>[l,r]</code> 中。<br><b>边界写法：</b>使用 <code>while (l &lt;= r)</code>，排除中点时必须写成 <code>mid+1</code> 或 <code>mid-1</code>。<br><b>易错点：</b>不要混用开区间与闭区间模板；下标体系必须与代码一致。',code:[
  'int binarySearch(int a[], int n, int target) {','    int l = 1, r = n;','    while (l <= r) {','        int mid = (l + r) >> 1;','        if (a[mid] == target) return mid;','        if (a[mid] < target) l = mid + 1;','        else r = mid - 1;','    }','    return -1;','}'
 ]},
 answer:{name:'二分答案',file:'binary_answer.cpp',complexity:'O(n log V)',visual:'最小可行值与 check(mid)',tips:'<b>核心前提：</b><code>check(x)</code> 的真假必须关于答案具有单调性。这里容量越大，完成天数只会不增。<br><b>模板含义：</b>寻找“第一个可行值”，可行时令 <code>r=mid</code>，不可行时令 <code>l=mid+1</code>。<br><b>本例：</b>包裹重量为 7、2、5、10、8，要求 2 天运完，最小容量是 18。',code:[
  'bool check(int cap) {','    int days = 1, load = 0;','    for (int w : weight) {','        if (load + w > cap) {','            days++; load = 0;','        }','        load += w;','    }','    return days <= D;','}','int minimumCapacity() {','    int l = maxWeight, r = totalWeight;','    while (l < r) {','        int mid = (l + r) >> 1;','        if (check(mid)) r = mid;','        else l = mid + 1;','    }','    return l;','}'

const canvas=$('board'),ctx=canvas.getContext('2d');let drawing=false,boardOn=false;function resizeBoard(){const copy=document.createElement('canvas');copy.width=canvas.width;copy.height=canvas.height;copy.getContext('2d').drawImage(canvas,0,0);canvas.width=innerWidth;canvas.height=innerHeight;ctx.drawImage(copy,0,0)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{if(!boardOn)return;drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke()};canvas.onpointerup=()=>drawing=false;$('toggleBoard').onclick=()=>{boardOn=!boardOn;canvas.style.display=boardOn?'block':'none';canvas.style.pointerEvents=boardOn?'auto':'none';document.body.classList.toggle('board-on',boardOn);$('toggleBoard').classList.toggle('active',boardOn);$('toggleBoard').textContent=boardOn?'✕ 关闭白板':'🖌️ 开启白板'};$('clearBoard').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);addEventListener('resize',resizeBoard);resizeBoard();loadMode(new URLSearchParams(location.search).get('mode')||'search');syncStageUI();
</script></body></html>
