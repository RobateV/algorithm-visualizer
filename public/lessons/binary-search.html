    .content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,38%) 1fr;gap:16px}.code-window{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:#1e1e1e;box-shadow:0 8px 24px rgba(0,0,0,.17)}.code-head{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#2d2d2d;color:#9ca3af;font-size:13px}.dot{width:12px;height:12px;border-radius:50%}.dot.r{background:#ef4444}.dot.y{background:#f59e0b}.dot.g{background:#10b981}.code-name{margin-left:8px}.complexity{margin-left:auto;color:#fbbf24;font-weight:700}.code{flex:1;overflow:auto;padding:12px 0;color:#d4d4d4;font:14px/1.72 Consolas,monospace;counter-reset:line}.code-line{position:relative;min-height:28px;white-space:pre;padding:2px 16px 2px 58px;border-left:4px solid transparent;transition:.2s}.code-line:before{counter-increment:line;content:counter(line);position:absolute;left:7px;width:34px;padding-right:8px;text-align:right;color:#64748b;border-right:1px solid #475569}.code-line.active{color:#fff;background:rgba(245,158,11,.18);border-left-color:var(--amber)}.kw{color:#c586c0}.num{color:#b5cea8}.comment{color:#6a9955}.fn{color:#dcdcaa}
    .right{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}.visual-card{flex:.64;min-height:0;padding:14px 18px;display:flex;flex-direction:column}.visual-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px;border-bottom:1px dashed #cbd5e1}.visual-head b{color:#0369a1}.step-badge{padding:5px 10px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:800}.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:12px}.controls{flex:none;display:flex;justify-content:center;gap:12px;padding-top:10px;border-top:1px dashed #cbd5e1}.btn{min-width:112px;border:2px solid #94a3b8;border-radius:999px;background:#fff;color:#64748b;padding:9px 16px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--blue);color:#0284c7}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 12px rgba(2,132,199,.13)}.btn:disabled{opacity:.38;cursor:not-allowed}
    .lower{flex:.36;min-height:0;display:grid;grid-template-columns:minmax(230px,.75fr) 1.55fr;gap:14px}.trace,.tips{min-height:0;overflow:auto;padding:16px 19px}.trace{border:2px solid var(--blue)}.trace h3,.tips h3{margin:0 0 9px;color:#0284c7;font-size:15px}.trace p,.tips-content{margin:0;color:#334155;font-size:14px;line-height:1.72}.trace code,.tips code{padding:2px 5px;border-radius:4px;background:#e0f2fe;color:#0284c7;font-weight:800}.tips h3{color:#0f172a;border-bottom:1px dashed #cbd5e1;padding-bottom:8px}.tips-content b{color:#0f172a}
    .array-scene{width:min(760px,100%)}.legend{display:flex;justify-content:center;gap:16px;margin-bottom:20px;font-size:12px;color:#64748b}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}.array-row{display:flex;justify-content:center;gap:8px}.array-item{position:relative;width:62px;transition:.35s}.cell{height:60px;display:grid;place-items:center;border:2px solid #7dd3fc;border-radius:10px;background:#fff;color:#0369a1;font-size:20px;font-weight:900;transition:.35s}.array-item.out .cell{border-color:#cbd5e1;background:#f1f5f9;color:#94a3b8;opacity:.55}.array-item.mid .cell{transform:translateY(-8px);border-color:var(--amber);background:#fef3c7;color:#b45309;box-shadow:0 8px 16px rgba(245,158,11,.23)}.array-item.found .cell{border-color:var(--green);background:#d1fae5;color:#047857;animation:pulse 1s infinite}.idx{text-align:center;margin-top:7px;color:#64748b;font:12px Consolas}.pointer{height:29px;text-align:center;font-size:12px;font-weight:900;white-space:nowrap}.pointer.l{color:#2563eb}.pointer.r{color:#ef4444}.pointer.m{color:#d97706}.pointer.combo{color:#7c3aed}.range-line{height:7px;margin-top:17px;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ef4444);transition:.35s}.comparison{text-align:center;margin-top:15px;color:#475569;font-weight:700}.comparison strong{color:#b45309}
    .answer-scene{width:min(790px,100%)}.metrics{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.metric{min-width:92px;padding:8px 12px;border:2px solid #bae6fd;border-radius:10px;background:#fff;text-align:center}.metric span{display:block;color:#64748b;font-size:11px}.metric b{display:block;margin-top:2px;color:#0369a1;font:800 18px Consolas}.metric.hot{border-color:var(--amber);background:#fffbeb}.metric.hot b{color:#b45309}.packages{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.package{position:relative;width:74px;padding:13px 6px 9px;border:2px solid #cbd5e1;border-radius:11px;background:#fff;text-align:center;transition:.3s}.package b{font-size:19px}.package small{display:block;margin-top:5px;color:#64748b}.package.active{transform:translateY(-8px);border-color:var(--amber);background:#fffbeb;box-shadow:0 8px 16px rgba(245,158,11,.18)}.package.day1{border-color:#38bdf8;background:#e0f2fe}.package.day2{border-color:#a78bfa;background:#ede9fe}.package.day3{border-color:#fb7185;background:#ffe4e6}.day-legend{text-align:center;margin-top:16px;color:#64748b;font-size:12px}.feasible{text-align:center;margin-top:13px;font-weight:900}.feasible.yes{color:#059669}.feasible.no{color:#dc2626}
    .real-scene{width:min(780px,100%)}.equation{text-align:center;margin-bottom:24px;font-size:18px;color:#334155}.equation code{color:#7c3aed;font-weight:900}.number-line{position:relative;height:112px;margin:0 48px}.axis{position:absolute;left:0;right:0;top:48px;height:5px;border-radius:99px;background:linear-gradient(90deg,#2563eb,#f59e0b,#ef4444)}.mark{position:absolute;top:27px;transform:translateX(-50%);text-align:center;transition:.45s}.mark:after{content:"";display:block;width:4px;height:42px;margin:auto;border-radius:2px;background:currentColor}.mark b{display:block;padding:4px 7px;border-radius:6px;background:#fff;box-shadow:0 3px 9px rgba(15,23,42,.12);font:800 13px Consolas;white-space:nowrap}.mark.left{left:4%;color:#2563eb}.mark.middle{left:50%;color:#d97706}.mark.right{left:96%;color:#ef4444}.interval{text-align:center;color:#475569;font:700 15px Consolas}.zoom{text-align:center;margin-top:8px;color:#64748b;font-size:12px}
    .phase-strip{display:flex;justify-content:center;gap:8px;margin-bottom:10px}.phase{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#94a3b8;font-size:11px;font-weight:800}.phase.on{background:#fef3c7;color:#b45309}.phase.done{background:#d1fae5;color:#047857}@keyframes pulse{50%{transform:scale(1.08)}}
    #board{position:fixed;inset:0;z-index:40;display:none;touch-action:none}.board-tools{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;gap:8px}.board-btn{border:0;border-radius:999px;background:#fff;padding:11px 16px;color:#334155;font-weight:800;box-shadow:0 6px 20px rgba(15,23,42,.18);cursor:pointer}.board-btn.active{background:#ef4444;color:#fff}.clear-btn{display:none}.board-on .clear-btn{display:block}
    @media(max-width:900px){body{height:auto;min-height:100vh;overflow:auto}.wrapper{height:auto;padding:10px}.app{min-height:100vh}.content{grid-template-columns:1fr}.code-window{height:420px}.right{min-height:680px}.subtitle{display:none}.lower{grid-template-columns:1fr}.trace,.tips{max-height:260px}}@media(max-width:560px){header{padding:10px 12px}h1{font-size:17px}.full-btn{display:none}.mode-select{max-width:170px}.array-row{gap:3px}.array-item{width:43px}.cell{height:48px;font-size:16px}.btn{min-width:88px;padding:8px}.wrapper{padding:5px}.metrics{gap:5px}.metric{min-width:70px}}

<body><canvas id="board"></canvas><div class="wrapper"><div class="app">
  <header><div><h1>✨ 白学在线 - 二分算法全景演练 <span class="subtitle">边界、单调性与精度</span></h1></div><div class="head-actions"><select id="mode" class="mode-select"><option value="search">二分查找 (Binary Search)</option><option value="answer">二分答案 (Binary Answer)</option><option value="real">实数二分 (Real Binary)</option></select><button id="fullscreen" class="full-btn">🖥️ 全屏演示</button></div></header>
  <div class="content"><section class="code-window"><div class="code-head"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span id="codeName" class="code-name"></span><span id="complexity" class="complexity"></span></div><div id="code" class="code"></div></section>
    <div class="right"><section class="visual-card glass"><div class="visual-head"><b id="visualTitle">状态变化</b><span id="stepBadge" class="step-badge"></span></div><div id="stage" class="stage"></div><div class="controls"><button id="prev" class="btn">← 上一步</button><button id="reset" class="btn">重置状态</button><button id="next" class="btn primary">下一步 →</button></div></section>
      <div class="lower"><section class="trace glass"><h3>实时执行分析</h3><p id="description"></p></section><section class="tips glass"><h3>💡 算法答题思路与核心提炼</h3><div id="tips" class="tips-content"></div></section></div>
    </div></div>
</div></div><div class="board-tools"><button id="clearBoard" class="board-btn clear-btn">清空</button><button id="toggleBoard" class="board-btn">🖌️ 开启白板</button></div>
<script>
const MODES={
 search:{name:'二分查找',file:'binary_search.cpp',complexity:'O(log n)',visual:'有序数组与闭区间 [l, r]',tips:'<b>循环不变量：</b>答案如果存在，始终位于闭区间 <code>[l,r]</code> 中。<br><b>边界写法：</b>使用 <code>while (l &lt;= r)</code>，排除中点时必须写成 <code>mid+1</code> 或 <code>mid-1</code>。<br><b>易错点：</b>不要混用开区间与闭区间模板；下标体系必须与代码一致。',code:[
  'int binarySearch(int a[], int n, int target) {','    int l = 1, r = n;','    while (l <= r) {','        int mid = (l + r) >> 1;','        if (a[mid] == target) return mid;','        if (a[mid] < target) l = mid + 1;','        else r = mid - 1;','    }','    return -1;','}'
 ]},
 answer:{name:'二分答案',file:'binary_answer.cpp',complexity:'O(n log V)',visual:'最小可行值与 check(mid)',tips:'<b>核心前提：</b><code>check(x)</code> 的真假必须关于答案具有单调性。这里容量越大，完成天数只会不增。<br><b>模板含义：</b>寻找“第一个可行值”，可行时令 <code>r=mid</code>，不可行时令 <code>l=mid+1</code>。<br><b>本例：</b>包裹重量为 7、2、5、10、8，要求 2 天运完，最小容量是 18。',code:[
  'bool check(int cap) {','    int days = 1, load = 0;','    for (int w : weight) {','        if (load + w > cap) {','            days++; load = 0;','        }','        load += w;','    }','    return days <= D;','}','int minimumCapacity() {','    int l = maxWeight, r = totalWeight;','    while (l < r) {','        int mid = (l + r) >> 1;','        if (check(mid)) r = mid;','        else l = mid + 1;','    }','    return l;','}'
 ]},
 real:{name:'实数二分',file:'real_binary.cpp',complexity:'O(log((R-L)/ε))',visual:'连续区间缩小与精度控制',tips:'<b>目标：</b>求 <code>√10</code>，也就是找到满足 <code>x²=10</code> 的实数。<br><b>与整数二分不同：</b>实数区间不使用 <code>mid±1</code>，而是直接令端点等于 <code>mid</code>。<br><b>终止方式：</b>竞赛中常使用固定迭代次数，避免浮点误差导致死循环。',code:[
  'double sqrtByBinary(double x) {','    double l = 0.0, r = max(1.0, x);','    for (int round = 1; round <= 12; round++) {','        double mid = (l + r) / 2.0;','        if (mid * mid < x) l = mid;','        else r = mid;','    }','    return (l + r) / 2.0;','}'
 ]}
};
const searchValues=[2,5,8,12,16,23,38,56,72],searchTarget=23,weights=[7,2,5,10,8],dayLimit=2;let currentMode='search',states=[],stateIndex=0;
const $=id=>document.getElementById(id);function clone(x){return JSON.parse(JSON.stringify(x))}function state(line,phase,desc,data){return{line,phase,desc,...clone(data)}}
function buildSearchStates(){const out=[];let l=1,r=searchValues.length;out.push(state(2,'初始化','建立闭区间 <code>[1,9]</code>。目标值 23 如果存在，一定在这个区间中。',{l,r,mid:null,status:'init'}));while(l<=r){out.push(state(3,'循环判断',`检查 <code>l &lt;= r</code>：${l} ≤ ${r} 成立，区间仍非空。`,{l,r,mid:null,status:'loop'}));const mid=(l+r)>>1;out.push(state(4,'计算中点',`计算 <code>mid = (${l}+${r})/2 = ${mid}</code>，读取 <code>a[${mid}] = ${searchValues[mid-1]}</code>。`,{l,r,mid,status:'mid'}));const value=searchValues[mid-1];if(value===searchTarget){out.push(state(5,'找到答案',`<code>a[${mid}] = ${value}</code>，恰好等于目标值 23，返回下标 ${mid}。`,{l,r,mid,status:'found'}));break}if(value<searchTarget){out.push(state(5,'比较',`<code>a[${mid}] = ${value} &lt; 23</code>，中点及其左侧都不可能是答案。`,{l,r,mid,status:'less'}));l=mid+1;out.push(state(6,'收缩区间',`执行 <code>l = mid + 1</code>，新区间变为 <code>[${l},${r}]</code>。`,{l,r,mid:null,status:'shrink'}))}else{out.push(state(5,'比较',`<code>a[${mid}] = ${value} &gt; 23</code>，中点及其右侧都不可能是答案。`,{l,r,mid,status:'greater'}));r=mid-1;out.push(state(7,'收缩区间',`执行 <code>r = mid - 1</code>，新区间变为 <code>[${l},${r}]</code>。`,{l,r,mid:null,status:'shrink'}))}}return out}
function simulateCheck(cap){let days=1,load=0;const assignments=Array(weights.length).fill(0),trace=[];for(let i=0;i<weights.length;i++){const w=weights[i];let newDay=false;if(load+w>cap){days++;load=0;newDay=true}load+=w;assignments[i]=days;trace.push({i,days,load,newDay,assignments:[...assignments]})}return{feasible:days<=dayLimit,days,trace}}
function buildAnswerStates(){const out=[];let l=Math.max(...weights),r=weights.reduce((a,b)=>a+b,0);out.push(state(12,'初始化',`答案下界取最大包裹重量 ${l}，上界取总重量 ${r}，搜索区间为 <code>[${l},${r}]</code>。`,{l,r,mid:null,assignments:[0,0,0,0,0],days:null,load:null,current:null}));while(l<r){out.push(state(13,'循环判断',`检查 <code>l &lt; r</code>：${l} &lt; ${r} 成立，答案尚未确定。`,{l,r,mid:null,assignments:[0,0,0,0,0],days:null,load:null,current:null}));const mid=(l+r)>>1;out.push(state(14,'计算中点',`尝试容量 <code>mid = (${l}+${r})/2 = ${mid}</code>，接下来完整执行 <code>check(${mid})</code>。`,{l,r,mid,assignments:[0,0,0,0,0],days:1,load:0,current:null}));const result=simulateCheck(mid);for(const t of result.trace){const action=t.newDay?`当前天装不下 ${weights[t.i]}，先开启第 ${t.days} 天，再装入。`:`第 ${t.days} 天还能装下 ${weights[t.i]}，直接装入。`;out.push(state(t.newDay?5:7,'执行 check',`${action} 当前载重为 <code>${t.load}/${mid}</code>。`,{l,r,mid,assignments:t.assignments,days:t.days,load:t.load,current:t.i}))}out.push(state(9,'可行性判定',`check(${mid}) 共使用 ${result.days} 天，${result.feasible?'不超过':'超过'}限制 ${dayLimit} 天，因此当前容量${result.feasible?'可行':'不可行'}。`,{l,r,mid,assignments:result.trace.at(-1).assignments,days:result.days,load:result.trace.at(-1).load,current:null,feasible:result.feasible}));if(result.feasible){r=mid;out.push(state(15,'收缩答案区间',`容量 ${mid} 可行，但还要尝试更小值，执行 <code>r = mid</code>，新区间为 <code>[${l},${r}]</code>。`,{l,r,mid:null,assignments:[0,0,0,0,0],days:null,load:null,current:null}))}else{l=mid+1;out.push(state(16,'收缩答案区间',`容量 ${mid} 不可行，更小值也一定不可行，执行 <code>l = mid + 1</code>，新区间为 <code>[${l},${r}]</code>。`,{l,r,mid:null,assignments:[0,0,0,0,0],days:null,load:null,current:null}))}}out.push(state(18,'得到答案',`此时 <code>l = r = ${l}</code>，第一个可行容量就是 ${l}。`,{l,r,mid:l,assignments:simulateCheck(l).trace.at(-1).assignments,days:simulateCheck(l).days,load:null,current:null,feasible:true,done:true}));return out}
function buildRealStates(){const out=[];let l=0,r=10;out.push(state(2,'初始化','要求 <code>√10</code>，先建立区间 <code>[0,10]</code>。',{l,r,mid:null,round:0,square:null}));for(let round=1;round<=12;round++){const mid=(l+r)/2,square=mid*mid;out.push(state(4,'计算中点',`第 ${round} 轮：<code>mid = (${l.toFixed(6)} + ${r.toFixed(6)}) / 2 = ${mid.toFixed(6)}</code>。`,{l,r,mid,round,square}));if(square<10){l=mid;out.push(state(5,'比较并收缩',`<code>mid² = ${square.toFixed(6)} &lt; 10</code>，答案在右半区，执行 <code>l = mid</code>。`,{l,r,mid,round,square,result:'less'}))}else{r=mid;out.push(state(6,'比较并收缩',`<code>mid² = ${square.toFixed(6)} ≥ 10</code>，答案在左半区，执行 <code>r = mid</code>。`,{l,r,mid,round,square,result:'greater'}))}}const answer=(l+r)/2;out.push(state(8,'得到近似值',`12 轮后区间宽度缩小到 ${(r-l).toFixed(8)}，返回中点 <code>${answer.toFixed(8)}</code>。`,{l,r,mid:answer,round:12,square:answer*answer,done:true}));return out}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function colorCode(s){let [main,comment]=s.split('//');let html=escapeHtml(main).replace(/\b(int|double|bool|return|while|for|if|else)\b/g,'<span class="kw">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>').replace(/\b(binarySearch|check|minimumCapacity|sqrtByBinary|max)\b/g,'<span class="fn">$1</span>');if(comment!==undefined)html+='<span class="comment">//'+escapeHtml(comment)+'</span>';return html}
function renderCode(){const box=$('code');box.innerHTML='';MODES[currentMode].code.forEach((line,i)=>{const d=document.createElement('div');d.id='line-'+(i+1);d.className='code-line'+(states[stateIndex].line===i+1?' active':'');d.innerHTML=colorCode(line);box.appendChild(d)});const active=$('line-'+states[stateIndex].line);if(active)active.scrollIntoView({block:'center'})}
function phaseHtml(active){const phases=currentMode==='answer'?['初始化','计算中点','执行 check','可行性判定','收缩答案区间','得到答案']:currentMode==='real'?['初始化','计算中点','比较并收缩','得到近似值']:['初始化','计算中点','比较','收缩区间','找到答案'];const ai=Math.max(0,phases.indexOf(active));return '<div class="phase-strip">'+phases.map((p,i)=>`<span class="phase ${i===ai?'on':i<ai?'done':''}">${p}</span>`).join('')+'</div>'}
function renderSearch(s){const width=((s.r-s.l+1)/searchValues.length)*100,left=((s.l-1)/searchValues.length)*100;return `<div class="array-scene">${phaseHtml(s.phase)}<div class="legend"><span><i style="background:#3b82f6"></i>l 左边界</span><span><i style="background:#f59e0b"></i>mid 中点</span><span><i style="background:#ef4444"></i>r 右边界</span></div><div class="array-row">${searchValues.map((v,i)=>{const idx=i+1,out=idx<s.l||idx>s.r,mid=idx===s.mid,found=mid&&s.status==='found',labels=[];if(idx===s.l)labels.push('l');if(idx===s.mid)labels.push('mid');if(idx===s.r)labels.push('r');const labelClass=labels.length>1?'combo':labels[0]==='l'?'l':labels[0]==='r'?'r':'m';return `<div class="array-item ${out?'out ':''}${mid?'mid ':''}${found?'found':''}"><div class="pointer ${labelClass}">${labels.join(' = ')}</div><div class="cell">${v}</div><div class="idx">[${idx}]</div></div>`}).join('')}</div><div class="range-line" style="width:${Math.max(8,width)}%;margin-left:${left}%"></div><div class="comparison">目标值：<strong>${searchTarget}</strong>${s.mid?`　当前：a[${s.mid}] = <strong>${searchValues[s.mid-1]}</strong>`:''}</div></div>`}
function renderAnswer(s){return `<div class="answer-scene">${phaseHtml(s.phase)}<div class="metrics"><div class="metric"><span>l</span><b>${s.l}</b></div><div class="metric hot"><span>mid / 当前容量</span><b>${s.mid??'—'}</b></div><div class="metric"><span>r</span><b>${s.r}</b></div><div class="metric"><span>已用天数 / 限制</span><b>${s.days??'—'} / ${dayLimit}</b></div><div class="metric"><span>当天载重</span><b>${s.load??'—'}</b></div></div><div class="packages">${weights.map((w,i)=>`<div class="package ${s.assignments[i]?'day'+s.assignments[i]:''} ${s.current===i?'active':''}"><b>${w}</b><small>${s.assignments[i]?'第 '+s.assignments[i]+' 天':'未处理'}</small></div>`).join('')}</div><div class="day-legend">问题：这些包裹按顺序装运，能否在 2 天内完成？</div>${s.feasible===undefined?'':`<div class="feasible ${s.feasible?'yes':'no'}">check(${s.mid}) = ${s.feasible?'true，可行':'false，不可行'}</div>`}</div>`}
function renderReal(s){const square=s.square==null?'—':s.square.toFixed(8);return `<div class="real-scene">${phaseHtml(s.phase)}<div class="equation">目标：<code>x² = 10</code>　当前 <code>mid² = ${square}</code></div><div class="number-line"><div class="axis"></div><div class="mark left"><b>l = ${s.l.toFixed(8)}</b></div>${s.mid==null?'':`<div class="mark middle"><b>mid = ${s.mid.toFixed(8)}</b></div>`}<div class="mark right"><b>r = ${s.r.toFixed(8)}</b></div></div><div class="interval">当前区间宽度：${(s.r-s.l).toFixed(10)}</div><div class="zoom">画面会持续放大当前 [l, r]，端点数值才是真实比例依据</div></div>`}
function render(){const cfg=MODES[currentMode],s=states[stateIndex];$('codeName').textContent=cfg.file;$('complexity').textContent=cfg.complexity;$('visualTitle').textContent=cfg.visual;$('stepBadge').textContent=`第 ${stateIndex+1} / ${states.length} 步`;$('description').innerHTML=`<b>【${s.phase}】</b><br>${s.desc}`;$('tips').innerHTML=cfg.tips;$('stage').innerHTML=currentMode==='search'?renderSearch(s):currentMode==='answer'?renderAnswer(s):renderReal(s);$('prev').disabled=stateIndex===0;$('next').disabled=stateIndex===states.length-1;renderCode()}
function loadMode(mode){currentMode=MODES[mode]?mode:'search';$('mode').value=currentMode;states=currentMode==='search'?buildSearchStates():currentMode==='answer'?buildAnswerStates():buildRealStates();stateIndex=0;history.replaceState(null,'','?mode='+currentMode);render()}$('prev').onclick=()=>{if(stateIndex>0){stateIndex--;render()}};$('next').onclick=()=>{if(stateIndex<states.length-1){stateIndex++;render()}};$('reset').onclick=()=>{stateIndex=0;render()};$('mode').onchange=e=>loadMode(e.target.value);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});
function tellParent(action){if(window.parent!==window)window.parent.postMessage({type:'lesson-fullscreen',action},location.origin)}$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else{tellParent('enter');document.documentElement.requestFullscreen()}};document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;$('fullscreen').textContent=full?'🔳 退出全屏':'🖥️ 全屏演示';if(!full)tellParent('exit');resizeBoard()});
const canvas=$('board'),ctx=canvas.getContext('2d');let drawing=false,boardOn=false;function resizeBoard(){const copy=document.createElement('canvas');copy.width=canvas.width;copy.height=canvas.height;copy.getContext('2d').drawImage(canvas,0,0);canvas.width=innerWidth;canvas.height=innerHeight;ctx.drawImage(copy,0,0)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{if(!boardOn)return;drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke()};canvas.onpointerup=()=>drawing=false;$('toggleBoard').onclick=()=>{boardOn=!boardOn;canvas.style.display=boardOn?'block':'none';canvas.style.pointerEvents=boardOn?'auto':'none';document.body.classList.toggle('board-on',boardOn);$('toggleBoard').classList.toggle('active',boardOn);$('toggleBoard').textContent=boardOn?'✕ 关闭白板':'🖌️ 开启白板'};$('clearBoard').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);addEventListener('resize',resizeBoard);resizeBoard();loadMode(new URLSearchParams(location.search).get('mode')||'search');
</script></body></html>
