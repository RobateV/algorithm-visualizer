t:14px/1.72 Consolas,monospace;counter-reset:line}.code-line{position:relative;min-height:28px;white-space:pre;padding:2px 16px 2px 58px;border-left:4px solid transparent}.code-line:before{counter-increment:line;content:counter(line);position:absolute;left:7px;width:34px;padding-right:8px;text-align:right;color:#64748b;border-right:1px solid #475569}.code-line.active{color:#fff;background:rgba(245,158,11,.18);border-left-color:var(--amber)}.kw{color:#c586c0}.num{color:#b5cea8}.comment{color:#6a9955}.fn{color:#dcdcaa}.right{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}.visual-card{flex:.64;min-height:0;padding:14px 18px;display:flex;flex-direction:column}.visual-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px;border-bottom:1px dashed #cbd5e1}.visual-head b{color:#0369a1}.step-badge{padding:5px 10px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:800}.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:10px}.controls{flex:none;display:flex;justify-content:center;gap:12px;padding-top:10px;border-top:1px dashed #cbd5e1}.btn{min-width:112px;border:2px solid #94a3b8;border-radius:999px;background:#fff;color:#64748b;padding:9px 16px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--blue);color:#0284c7}.btn:disabled{opacity:.38;cursor:not-allowed}.lower{flex:.36;min-height:0;display:grid;grid-template-columns:minmax(230px,.75fr) 1.55fr;gap:14px}.trace,.tips{min-height:0;overflow:auto;padding:16px 19px}.trace{border:2px solid var(--blue)}.trace h3,.tips h3{margin:0 0 9px;color:#0284c7;font-size:15px}.trace p,.tips-content{margin:0;color:#334155;font-size:14px;line-height:1.72}.trace code,.tips code{padding:2px 5px;border-radius:4px;background:#e0f2fe;color:#0284c7;font-weight:800}.tips h3{color:#0f172a;border-bottom:1px dashed #cbd5e1;padding-bottom:8px}.tips-content b{color:#0f172a}.phase-strip{display:flex;justify-content:center;gap:8px;margin-bottom:15px}.phase{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#94a3b8;font-size:11px;font-weight:800}.phase.on{background:#fef3c7;color:#b45309}.phase.done{background:#d1fae5;color:#047857}

size:13px}.delta{color:#dc2626;font-weight:900}.result{color:#059669;font-weight:900}#board{position:fixed;inset:0;z-index:40;display:none;touch-action:none}.board-tools{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;gap:8px}.board-btn{border:0;border-radius:999px;background:#fff;padding:11px 16px;color:#334155;font-weight:800;box-shadow:0 6px 20px rgba(15,23,42,.18);cursor:pointer}.board-btn.active{background:#ef4444;color:#fff}.clear-btn{display:none}.board-on .clear-btn{display:block}

<body><canvas id="board"></canvas><div class="wrapper"><div class="app"><header><h1>✨ 白学在线 - 前缀和与差分全景演练 <span class="subtitle">预处理、容斥与端点修改</span></h1><div class="head-actions"><select id="mode" class="mode-select"><option value="prefix1d">一维前缀和</option><option value="prefix2d">二维前缀和</option><option value="difference">一维差分</option></select><button id="fullscreen" class="full-btn">🖥️ 全屏演示</button></div></header><div class="content"><section class="code-window"><div class="code-head"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span id="codeName" class="code-name"></span><span id="complexity" class="complexity"></span></div><div id="code" class="code"></div></section><div class="right"><section class="visual-card glass"><div class="visual-head"><b id="visualTitle"></b><span id="stepBadge" class="step-badge"></span></div><div id="stage" class="stage"></div><div class="controls"><button id="prev" class="btn">← 上一步</button><button id="reset" class="btn">重置状态</button><button id="next" class="btn primary">下一步 →</button></div></section><div class="lower"><section class="trace glass"><h3>实时执行分析</h3><p id="description"></p></section><section class="tips glass"><h3>💡 算法答题思路与核心提炼</h3><div id="tips" class="tips-content"></div></section></div></div></div></div></div><div class="board-tools"><button id="clearBoard" class="board-btn clear-btn">清空</button><button id="toggleBoard" class="board-btn">🖌️ 开启白板</button></div>
<script>
const MODES={prefix1d:{file:'prefix_sum_1d.cpp',complexity:'预处理 O(n)，查询 O(1)',visual:'原数组 a 与前缀数组 s',tips:'<b>定义：</b><code>s[i]</code> 表示前 <code>i</code> 个元素的和，并规定 <code>s[0]=0</code>。<br><b>区间查询：</b><code>a[l]+...+a[r] = s[r]-s[l-1]</code>，左侧被多算的前缀正好减掉。<br><b>易错点：</b>数组通常从 1 开始，必须保留 0 号哨兵，避免 <code>l=1</code> 时越界。',code:['void buildPrefix() {','    s[0] = 0;','    for (int i = 1; i <= n; i++)','        s[i] = s[i - 1] + a[i];','}','int rangeSum(int l, int r) {','    return s[r] - s[l - 1];','}']},prefix2d:{file:'prefix_sum_2d.cpp',complexity:'预处理 O(nm)，查询 O(1)',visual:'二维前缀矩阵与矩形容斥',tips:'<b>定义：</b><code>s[i][j]</code> 是从 <code>(1,1)</code> 到 <code>(i,j)</code> 的矩形和。<br><b>预处理容斥：</b>上方加左方会重复左上角，所以必须减去 <code>s[i-1][j-1]</code>。<br><b>矩形查询：</b>用右下大矩形减去上方和左方，再把被减两次的左上角加回来。',code:['for (int i = 1; i <= n; i++)','    for (int j = 1; j <= m; j++)','        s[i][j] = a[i][j]','                + s[i - 1][j] + s[i][j - 1]','                - s[i - 1][j - 1];','int query(int x1, int y1, int x2, int y2) {','    return s[x2][y2] - s[x1 - 1][y2]','         - s[x2][y1 - 1] + s[x1 - 1][y1 - 1];','}']},difference:{file:'difference_array.cpp',complexity:'修改 O(1)，还原 O(n)',visual:'原数组、差分数组与还原结果',tips:'<b>定义：</b><code>d[i]=a[i]-a[i-1]</code>，因此对差分数组求前缀和即可还原原数组。<br><b>区间加：</b>给 <code>[l,r]</code> 全部加 <code>v</code>，只需执行 <code>d[l]+=v</code> 和 <code>d[r+1]-=v</code>。<br><b>理解端点：</b>左端点让增量开始生效，右端点后一位让增量停止生效。',code:['d[1] = a[1];','for (int i = 2; i <= n; i++)','    d[i] = a[i] - a[i - 1];','void add(int l, int r, int v) {','    d[l] += v;','    if (r + 1 <= n) d[r + 1] -= v;','}','for (int i = 1; i <= n; i++)','    result[i] = result[i - 1] + d[i];']}};
const a1=[3,1,4,1,5,9],matrix=[[1,3,2,4,5],[2,1,4,1,3],[3,2,1,5,2],[4,1,3,2,1]],diffSource=[2,5,3,4,1,6];let currentMode='prefix1d',states=[],stateIndex=0;const $=id=>document.getElementById(id);const copy=x=>JSON.parse(JSON.stringify(x));function S(line,phase,desc,data){return{line,phase,desc,...copy(data)}}
function build1D(){const out=[],prefix=Array(a1.length+1).fill(null);prefix[0]=0;out.push(S(2,'初始化','规定空前缀 <code>s[0] = 0</code>，它是处理左边界的哨兵。',{prefix,i:0}));for(let i=1;i<=a1.length;i++){prefix[i]=prefix[i-1]+a1[i-1];out.push(S(4,'预处理',`<code>s[${i}] = s[${i-1}] + a[${i}] = ${prefix[i-1]} + ${a1[i-1]} = ${prefix[i]}</code>。`,{prefix,i}))}out.push(S(6,'选择区间','现在查询区间 <code>[2,5]</code>，绿色元素之和是目标。',{prefix,i:null,l:2,r:5,query:true}));out.push(S(7,'区间作差',`<code>s[5] - s[1] = ${prefix[5]} - ${prefix[1]} = ${prefix[5]-prefix[1]}</code>，得到 a[2..5] 的区间和。`,{prefix,i:null,l:2,r:5,query:true,result:prefix[5]-prefix[1]}));return out}
function build2D(){const n=matrix.length,m=matrix[0].length,p=Array.from({length:n+1},()=>Array(m+1).fill(0)),out=[];out.push(S(1,'初始化','先补出全为 0 的第 0 行与第 0 列，后续公式无需单独判断边界。',{p,cell:null}));for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){p[i][j]=matrix[i-1][j-1]+p[i-1][j]+p[i][j-1]-p[i-1][j-1];out.push(S(3,'预处理',`<code>s[${i}][${j}] = ${matrix[i-1][j-1]} + ${p[i-1][j]} + ${p[i][j-1]} - ${p[i-1][j-1]} = ${p[i][j]}</code>。`,{p,cell:[i,j],sources:[[i-1,j],[i,j-1],[i-1,j-1]]}))}const q={x1:2,y1:2,x2:4,y2:4};out.push(S(6,'选择矩形','查询左上角 <code>(2,2)</code>、右下角 <code>(4,4)</code> 的绿色矩形。',{p,cell:null,q}));const ans=p[4][4]-p[1][4]-p[4][1]+p[1][1];out.push(S(7,'矩形容斥',`<code>${p[4][4]} - ${p[1][4]} - ${p[4][1]} + ${p[1][1]} = ${ans}</code>，加回被重复减去的左上角。`,{p,cell:null,q,result:ans,terms:[[4,4,'plus'],[1,4,'minus'],[4,1,'minus'],[1,1,'plus']]}));return out}
function buildDiff(){const n=diffSource.length,d=Array(n).fill(null),out=[],result=Array(n).fill(null);d[0]=diffSource[0];out.push(S(1,'建立差分',`<code>d[1] = a[1] = ${d[0]}</code>。`,{d,result,i:1,stage:'build'}));for(let i=2;i<=n;i++){d[i-1]=diffSource[i-1]-diffSource[i-2];out.push(S(3,'建立差分',`<code>d[${i}] = a[${i}] - a[${i-1}] = ${diffSource[i-1]} - ${diffSource[i-2]} = ${d[i-1]}</code>。`,{d,result,i,stage:'build'}))}out.push(S(4,'区间修改','准备把区间 <code>[2,5]</code> 中的每个元素增加 3。',{d,result,i:null,l:2,r:5,v:3,stage:'range'}));d[1]+=3;out.push(S(5,'增量开始',`执行 <code>d[2] += 3</code>，从下标 2 开始，后续前缀和都会多出 3。`,{d,result,i:2,l:2,r:5,v:3,stage:'range',change:'start'}));d[5]-=3;out.push(S(6,'增量结束',`执行 <code>d[6] -= 3</code>，抵消增量，使它在下标 5 之后停止生效。`,{d,result,i:6,l:2,r:5,v:3,stage:'range',change:'end'}));let sum=0;for(let i=1;i<=n;i++){sum+=d[i-1];result[i-1]=sum;out.push(S(9,'前缀还原',`<code>result[${i}] = result[${i-1}] + d[${i}] = ${i===1?0:result[i-2]} + ${d[i-1]} = ${sum}</code>。`,{d,result,i,l:2,r:5,v:3,stage:'restore'}))}out.push(S(9,'修改完成','还原结果为 <code>[2,8,6,7,4,6]</code>，只有区间 [2,5] 增加了 3。',{d,result,i:null,l:2,r:5,v:3,stage:'done',done:true}));return out}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function color(s){let [main,comment]=s.split('//'),h=esc(main).replace(/\b(int|void|return|for|if)\b/g,'<span class="kw">$1</span>').replace(/\b(\d+)\b/g,'<span class="num">$1</span>').replace(/\b(buildPrefix|rangeSum|query|add)\b/g,'<span class="fn">$1</span>');if(comment!==undefined)h+='<span class="comment">//'+esc(comment)+'</span>';return h}function renderCode(){const box=$('code'),active=states[stateIndex].line;box.innerHTML=MODES[currentMode].code.map((x,i)=>`<div id="line-${i+1}" class="code-line ${active===i+1?'active':''}">${color(x)}</div>`).join('');$('line-'+active)?.scrollIntoView({block:'center'})}function phases(active){const ps=currentMode==='prefix1d'?['初始化','预处理','选择区间','区间作差']:currentMode==='prefix2d'?['初始化','预处理','选择矩形','矩形容斥']:['建立差分','区间修改','增量开始','增量结束','前缀还原','修改完成'],i=Math.max(0,ps.indexOf(active));return `<div class="phase-strip">${ps.map((p,k)=>`<span class="phase ${k===i?'on':k<i?'done':''}">${p}</span>`).join('')}</div>`}
function row(name,values,s,kind){return `<div class="data-row"><div class="row-name">${name}</div>${values.map((v,k)=>{const idx=kind==='prefix'?k:k+1,active=s.i===idx,range=(s.query||s.l)&&['source','result'].includes(kind)&&idx>=s.l&&idx<=s.r,used=s.result!==undefined&&kind==='prefix'&&(idx===s.r||idx===s.l-1);return `<div class="box ${active?'active ':''}${range?'range ':''}${used?'used ':''}${idx===0?'zero':''}" data-index="[${idx}]">${v==null?'?':v}</div>`}).join('')}</div>`}function render1D(s){return `<div class="rows">${phases(s.phase)}${row('a[i]',a1,s,'source')}${row('s[i]',s.prefix,s,'prefix')}<div class="formula">${s.result!==undefined?`区间和 = <strong>${s.result}</strong>`:s.i?`s[${s.i}] = s[${s.i-1}] + a[${s.i}]`:'s[0] = 0'}</div></div>`}
function matrixHtml(values,s,prefix){const rows=prefix?values.slice(1).map(r=>r.slice(1)):values;return `<div class="matrix">${rows.flatMap((r,i)=>r.map((v,j)=>{const x=i+1,y=j+1,active=s.cell&&s.cell[0]===x&&s.cell[1]===y,source=prefix&&s.sources?.some(c=>c[0]===x&&c[1]===y),query=!prefix&&s.q&&x>=s.q.x1&&x<=s.q.x2&&y>=s.q.y1&&y<=s.q.y2,term=prefix&&s.terms?.find(c=>c[0]===x&&c[1]===y)?.[2]||'';return `<div class="mcell ${active?'active ':''}${source?'source ':''}${query?'query ':''}${term}">${v}</div>`})).join('')}</div>`}function render2D(s){return `<div class="matrix-scene">${phases(s.phase)}<div class="matrix-pair"><div class="matrix-wrap"><div class="matrix-title">原矩阵 a</div>${matrixHtml(matrix,s,false)}</div><div class="matrix-arrow">→</div><div class="matrix-wrap"><div class="matrix-title">二维前缀和 s</div>${matrixHtml(s.p,s,true)}</div></div><div class="formula">${s.result!==undefined?`查询矩形和 = <strong>${s.result}</strong>`:s.cell?`正在计算 s[${s.cell[0]}][${s.cell[1]}]`:'第 0 行、第 0 列均为 0'}</div></div>`}
function renderDiff(s){return `<div class="rows">${phases(s.phase)}${row('原 a[i]',diffSource,s,'source')}${row('差分 d[i]',s.d,s,'diff')}${row('还原值',s.result,s,'result')}<div class="difference-note">${s.l?`修改区间 [${s.l},${s.r}]，v = <span class="delta">+${s.v}</span>`:'先由相邻元素之差建立 d 数组'}${s.done?'　最终：<span class="result">[2, 8, 6, 7, 4, 6]</span>':''}</div></div>`}
function selfCheck(){const one=build1D().at(-1),two=build2D().at(-1),diff=buildDiff().at(-1);if(one.result!==11||two.result!==20||diff.result.join(',')!=='2,8,6,7,4,6')throw new Error('前缀和或差分状态计算错误')}function render(){const c=MODES[currentMode],s=states[stateIndex];$('codeName').textContent=c.file;$('complexity').textContent=c.complexity;$('visualTitle').textContent=c.visual;$('stepBadge').textContent=`第 ${stateIndex+1} / ${states.length} 步`;$('description').innerHTML=`<b>【${s.phase}】</b><br>${s.desc}`;$('tips').innerHTML=c.tips;$('stage').innerHTML=currentMode==='prefix1d'?render1D(s):currentMode==='prefix2d'?render2D(s):renderDiff(s);$('prev').disabled=stateIndex===0;$('next').disabled=stateIndex===states.length-1;renderCode()}function load(mode){currentMode=MODES[mode]?mode:'prefix1d';$('mode').value=currentMode;states=currentMode==='prefix1d'?build1D():currentMode==='prefix2d'?build2D():buildDiff();stateIndex=0;history.replaceState(null,'','?mode='+currentMode);render()}$('prev').onclick=()=>{if(stateIndex){stateIndex--;render()}};$('next').onclick=()=>{if(stateIndex<states.length-1){stateIndex++;render()}};$('reset').onclick=()=>{stateIndex=0;render()};$('mode').onchange=e=>load(e.target.value);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});function tellParent(action){if(parent!==window)parent.postMessage({type:'lesson-fullscreen',action},location.origin)}$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else{tellParent('enter');document.documentElement.requestFullscreen()}};document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;$('fullscreen').textContent=full?'🔳 退出全屏':'🖥️ 全屏演示';if(!full)tellParent('exit');resizeBoard()});const canvas=$('board'),ctx=canvas.getContext('2d');let drawing=false,boardOn=false;function resizeBoard(){canvas.width=innerWidth;canvas.height=innerHeight}canvas.onpointerdown=e=>{if(!boardOn)return;drawing=true;ctx.beginPath();ctx.moveTo(e.clientX,e.clientY)};canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(e.clientX,e.clientY);ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke()};canvas.onpointerup=()=>drawing=false;$('toggleBoard').onclick=()=>{boardOn=!boardOn;canvas.style.display=boardOn?'block':'none';document.body.classList.toggle('board-on',boardOn);$('toggleBoard').classList.toggle('active',boardOn);$('toggleBoard').textContent=boardOn?'✕ 关闭白板':'🖌️ 开启白板'};$('clearBoard').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);addEventListener('resize',resizeBoard);resizeBoard();selfCheck();load(new URLSearchParams(location.search).get('mode')||'prefix1d');
</script></body></html>
