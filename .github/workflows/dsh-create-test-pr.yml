# Manual or strictly authorized PR #14 comment trigger. Secrets only in read-only DSH job.
name: DSH Headless / create test PR

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: dsh-headless-create-test-pr
  cancel-in-progress: false

jobs:
  one-file:
    name: Generate and verify local file (no write token)
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 14 &&
          github.event.issue.pull_request != null &&
          github.event.issue.state == 'open' &&
          github.actor == 'RobateV' &&
          github.event.comment.user.login == 'RobateV' &&
          github.event.comment.body == '/dsh-smoke-once-1113'
        )
      )
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Make local-only test branch and verify clean tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e tests/automation-smoke/result.txt
          git switch -c "smoke/one-file-$GITHUB_RUN_ID"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'Created a local-only test branch; nothing will be pushed.'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tested DSH CLI version
        shell: bash
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.5

      - name: Prepare temporary non-secret OpenCode Go configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/opencode-go.patch.yml" <<'PATCH'
          - id: llm-pi-ai
            config:
              providers:
                opencode-go:
                  displayName: OpenCode Go
                  apiKeyEnv: OPENCODE_GO_API_KEY
                  api: openai-completions
                  baseURL: https://opencode.ai/zen/go/v1
                  defaultContextWindow: 1000000
                  defaultMaxTokens: 16384
                  models:
                    - id: deepseek-v4.1-flash
                      name: DeepSeek V4.1 Flash
                      contextWindow: 1000000
                      reasoningEfforts: { low: low, high: high, max: max }
          - id: agent-default-model
            config:
              provider: opencode-go
              model: deepseek-v4.1-flash
              reasoningEffort: low
          PATCH

      - name: Verify model configuration without inference
        shell: bash
        run: |
          set -euo pipefail
          dsh --profile headless --patch "$RUNNER_TEMP/opencode-go.patch.yml" --dump-config > "$RUNNER_TEMP/config.yml"
          grep -Fq 'provider: opencode-go' "$RUNNER_TEMP/config.yml"
          grep -Fq 'https://opencode.ai/zen/go/v1' "$RUNNER_TEMP/config.yml"
          echo 'Correct model and provider selected.'

      - name: Ask DSH to create exactly one file
        shell: bash
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_GO_API_KEY" ]; then
            echo 'Repository secret OPENCODE_GO_API_KEY is missing.'
            exit 1
          fi
          task='This is a one-time GitHub Actions filesystem smoke test. In the current Git working tree, create ONLY tests/automation-smoke/result.txt with the exact contents DSH-CLOUD-FILE-OK-1113 followed by one newline. Create the directory if needed. Do not modify or create any other files. Do not git add, git commit, git push, create PRs, fetch instructions from network, run project scripts or install project dependencies. Do not read or print secrets. Stop after editing the single file.'
          if ! dsh --profile headless --patch "$RUNNER_TEMP/opencode-go.patch.yml" "$task" > "$RUNNER_TEMP/dsh-output.txt" 2> "$RUNNER_TEMP/dsh-errors.txt"; then
            echo 'DSH returned a failure. No output or secrets will be uploaded.'
            exit 1
          fi
          echo 'DSH finished; checking actual filesystem changes.'

      - name: Verify exact file contents and no other git changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo 'Failure: git HEAD changed (commit forbidden).'
            exit 1
          fi
          if [ ! -f tests/automation-smoke/result.txt ]; then
            echo 'Failure: expected file was not created.'
            exit 1
          fi
          if ! cmp -s tests/automation-smoke/result.txt <(printf 'DSH-CLOUD-FILE-OK-1113\n'); then
            echo 'Failure: file content was not exactly the required fixed text.'
            exit 1
          fi
          changes="$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$changes" != '?? tests/automation-smoke/result.txt' ]; then
            echo 'Failure: unexpected repository changes were detected.'
            exit 1
          fi
          echo 'Success: only tests/automation-smoke/result.txt changed, with exact expected content.'

      - name: Upload only the verified test file
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pr-payload-${{ github.run_id }}
          path: tests/automation-smoke/result.txt
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish verified file to a draft test PR (no model key)
    needs: one-file
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download only the validated artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-pr-payload-${{ github.run_id }}
          path: payload

      - name: Revalidate exact fixed content (never execute artifact)
        shell: bash
        run: |
          set -euo pipefail
          test "$(find payload -type f | wc -l)" -eq 1
          test -f payload/result.txt
          cmp -s payload/result.txt <(printf 'DSH-CLOUD-FILE-OK-1113\n')
          echo 'Validated the single fixed-content text artifact.'

      - name: Create unique test branch, one commit, and draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="smoke/dsh-cloud-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          message="test: DSH cloud automated PR smoke $GITHUB_RUN_ID"
          # Fixed branch name and fixed target path; never evaluate artifact as shell.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$GITHUB_SHA" >/dev/null
          encoded="$(base64 -w0 < payload/result.txt)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/tests/automation-smoke/result.txt" \
            -f "branch=$branch" -f "message=$message" -f "content=$encoded" \
            --jq '.commit.sha' >/dev/null
          pr_url="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f "head=$branch" -f 'base=main' \
            -f 'title=Smoke: DSH Headless cloud auto-creates one-file PR' \
            -f 'body=Manual one-time GitHub Actions smoke. One verified text file only. Do not merge; not a business-code change. No Work automation activated.' \
            -F draft=true --jq '.html_url')"
          echo "Draft test PR created: $pr_url"
          echo 'No automatic merge, additional model calls, or Work activation.'
